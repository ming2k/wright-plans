name = "libjpeg-turbo"
version = "3.2.0"
release = 1
description = "SIMD-accelerated JPEG codec (libjpeg v8 compatible)"
license = "IJG"
arch = "x86_64"


build_deps = ['cmake', 'nasm', 'ninja', 'pkgconf']

[[sources]]
type = "http"
sha256 = "6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e"
url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libjpeg-turbo-${VERSION}
cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib -DWITH_JPEG8=ON'''

[pipeline.compile]
script = '''
cd source/libjpeg-turbo-${VERSION}
ninja -C build'''

[pipeline.staging]
script = '''
cd source/libjpeg-turbo-${VERSION}
DESTDIR=${STAGING_DIR} ninja -C build install
# Provide the conventional libjpeg.pc name for pkg-config compatibility.
if [ ! -f ${STAGING_DIR}/usr/lib/pkgconfig/libjpeg.pc ]; then
    ln -sv libjpeg-turbo.pc ${STAGING_DIR}/usr/lib/pkgconfig/libjpeg.pc
fi'''
