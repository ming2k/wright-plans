name = "mold"
version = "2.42.1"
release = 1
description = "A high-performance parallel linker"
license = "MIT"
arch = "x86_64"
url = "https://github.com/rui314/mold"

# mold is a self-contained ELF linker: a single /usr/bin/mold plus symlinks.
# All optional libs (zlib, zstd, blake3, mimalloc, tbb, rust-demangle, xxhash)
# are vendored via git-subtree into third-party/ and statically linked — never
# shipped as shared libs — so mold has no shared-library ABI of its own. Its
# only runtime link is to the toolchain's libc/libm/libstdc++/libgcc_s.
#
# mold needs a C++20 compiler; we use clang/clang++ from the llvm plan (gcc is
# fine too, but clang is what upstream dist.sh ships and is the safer default).
build_deps = ['cmake', 'ninja', 'llvm:clang']

# Upstream vendors third-party libraries directly in the source tree via git
# subtree (not git submodules), which are included in GitHub source tarballs.
[[sources]]
type = "http"
url = "https://github.com/rui314/mold/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "0580221bfdad7148ceeafd0ad3c1c7b3ca9e66b45950405230cc3f81a205c816"
extract_to = "source"

[options]
timeout = 7200   # mold instantiates ~21 targets per template file; needs time

[pipeline.configure]
script = '''
cd source/mold-${VERSION}
test -f CMakeLists.txt
test -d third-party/tbb
test -d third-party/blake3
test -d third-party/mimalloc
test -d third-party/rust-demangle
test -d third-party/xxhash
test -d third-party/zlib
test -d third-party/zstd

cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_C_COMPILER=clang \
    -DCMAKE_CXX_COMPILER=clang++ \
    -DMOLD_USE_MOLD=OFF \
    -DMOLD_LTO=OFF'''

[pipeline.compile]
script = '''
cd source/mold-${VERSION}
ninja -C build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/mold-${VERSION}
DESTDIR=${STAGING_DIR} ninja -C build install

# Verify the artifacts and symlinks dist.sh / upstream ship actually landed.
test -x ${STAGING_DIR}/usr/bin/mold
test -L ${STAGING_DIR}/usr/bin/ld.mold
test -x ${STAGING_DIR}/usr/libexec/mold/ld
test -f ${STAGING_DIR}/usr/lib/mold/mold-wrapper.so
test -f ${STAGING_DIR}/usr/share/man/man1/mold.1
test -L ${STAGING_DIR}/usr/share/man/man1/ld.mold.1
test -f ${STAGING_DIR}/usr/share/doc/mold/LICENSE'''

[[output]]
name = "mold"
runtime_deps = ['glibc', 'gcc:libstdc++']
