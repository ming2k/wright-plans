name = "aegis"
version = "0.0.13"
release = 1
description = "Aegis Wayland compositor and desktop shell"
license = "MIT AND GPL-3.0-only"
arch = "x86_64"
url = "https://github.com/aegis-shell/aegis"

build_deps = [
    'rust', 'pkgconf', 'llvm:clang',
    'wayland-protocols', 'vulkan-headers',
]
link_deps = [
    'optics:flux = 0.0.10',
    'optics:flux-text = 0.0.10',
    'optics:flux-scene-graph = 0.0.10',
    'optics:lens = 0.0.10',
    'optics:iris = 0.0.10',
    'wayland', 'libxkbcommon', 'libinput', 'seatd',
    'systemd', 'linux-pam', 'vulkan-loader',
    'gcc:gcc-libs', 'glibc',
]

[[sources]]
type = "http"
url = "https://github.com/aegis-shell/aegis/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "c7a7b0c3116e3cb2abcc0fb2e794bffd12605170b7af3152f11856882883c27b"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/aegis-${VERSION}
# The canonical package build uses the locked Optics v0.0.10 Git bindings and
# the matching native Wright outputs. A local .cargo/config.toml must never be
# present in the release source.
test ! -e .cargo/config.toml
for pc in flux flux-text flux-scene-graph lens iris; do
    test "$(pkg-config --modversion "$pc")" = "0.0.10"
done
'''

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_TARGET_DIR = '${WORKDIR}/target', CARGO_NET_GIT_FETCH_WITH_CLI = 'true' }
script = '''
cd source/aegis-${VERSION}
cargo build --locked --release --workspace'''

[pipeline.staging]
script = '''
src="${WORKDIR}/source/aegis-${VERSION}"
bin="${WORKDIR}/target/release"
out="${STAGING_DIR}/usr"

# Install the explicit distribution artifacts. aegis-lock-preview is a
# feature-gated contributor tool and must not be packaged.
for b in \
    aegis aegis-idle aegis-atspi aegis-lock aegis-settings \
    aegis-mcp aegis-agent; do
    install -Dm755 "$bin/$b" "$out/bin/$b"
done

# Desktop entry + icon.
install -Dm644 "$src/contrib/io.github.ming2k.aegis.Settings.desktop" \
    "$out/share/applications/io.github.ming2k.aegis.Settings.desktop"
install -Dm644 "$src/contrib/icons/hicolor/scalable/apps/io.github.ming2k.aegis.Settings.svg" \
    "$out/share/icons/hicolor/scalable/apps/io.github.ming2k.aegis.Settings.svg"

# systemd user unit (ExecStart=/usr/bin/aegis ...). Keep its Delegate=cpu
# memory pids — Realm sandboxing depends on the delegated controllers.
install -Dm644 "$src/contrib/systemd/user/aegis.service" \
    "$out/lib/systemd/user/aegis.service"

# Authentication policy for the first-party session locker.
install -Dm644 "$src/contrib/pam/aegis-lock" \
    "${STAGING_DIR}/etc/pam.d/aegis-lock"

# Project and bundled-cursor license disclosures.
install -Dm644 "$src/LICENSE" \
    "$out/share/licenses/aegis/LICENSE"

# Bundled Bibata-Modern-Ice (GPL-3.0) license disclosure. The theme is embedded
# into the aegis binary via include_dir, so its LICENSE/NOTICE must ship too.
install -Dm644 "$src/assets/cursors/Bibata-Modern-Ice/LICENSE" \
    "$out/share/licenses/aegis/Bibata-Modern-Ice/LICENSE"
install -Dm644 "$src/assets/cursors/Bibata-Modern-Ice/NOTICE" \
    "$out/share/licenses/aegis/Bibata-Modern-Ice/NOTICE"'''

[[output]]
runtime_deps = [
    'optics:flux = 0.0.10',
    'optics:flux-text = 0.0.10',
    'optics:flux-scene-graph = 0.0.10',
    'optics:lens = 0.0.10',
    'optics:iris = 0.0.10',
    'brightnessctl', 'dbus', 'hicolor-icon-theme',
    'seatd', 'libinput', 'systemd', 'linux-pam',
    'wayland', 'libxkbcommon', 'vulkan-loader',
    'gcc:gcc-libs', 'glibc',
]
backup = ["/etc/pam.d/aegis-lock"]

[output.hooks]
# Desktop and icon cache refreshes are advisory because their tools may be
# absent on a minimal Wright-managed system. Do not call systemctl --user from
# a package transaction; it cannot address every affected user session.
post_install = '''
update-desktop-database -q /usr/share/applications 2>/dev/null || true
gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
'''
post_upgrade = '''
update-desktop-database -q /usr/share/applications 2>/dev/null || true
gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
'''
