name = "bottom"
version = "0.14.9"
release = 1
description = "Yet another cross-platform graphical process/system monitor"
license = "MIT"
arch = "x86_64"
url = "https://github.com/ClementTsang/bottom"


build_deps = ['rust-bin']

[[sources]]
type = "http"
sha256 = "1dbb940c763fb583b7e1c7dfa165b73ed9a0ba712e72cc97311c5b1c098d5b72"
url = "https://github.com/ClementTsang/bottom/archive/refs/tags/${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_TARGET_DIR = '${WORKDIR}/target' }
script = '''
cd source/bottom-${VERSION}
cargo build --release --locked'''

[pipeline.staging]
script = '''
cd source/bottom-${VERSION}
install -Dm755 target/release/btm ${STAGING_DIR}/usr/bin/btm'''
