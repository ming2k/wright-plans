name = "libmanette"
version = "0.2.7"
release = 1
description = "Simple GObject game controller library"
license = "LGPL-2.1-or-later"
arch = "x86_64"

link_deps = ['glib']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://download.gnome.org/sources/libmanette/0.2/libmanette-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libmanette-${VERSION}
# libmanette calls its example option "demos"; enable introspection and disable Vala bindings.
meson setup build --prefix=/usr --libdir=lib -Dintrospection=true -Dvapi=false -Ddemos=false'''

[pipeline.compile]
script = '''
cd source/libmanette-${VERSION}/build
ninja -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libmanette-${VERSION}/build
DESTDIR=${STAGING_DIR} ninja install'''

[[output]]
runtime_deps = ['libevdev', 'libgudev', 'glib']
