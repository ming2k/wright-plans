name = "aegis"
version = "0.0.8"
release = 1
description = "Aegis Wayland compositor and desktop shell"
license = "MIT AND GPL-3.0-only"
arch = "x86_64"
url = "https://github.com/ming2k/aegis"

# Optics is a separate multi-output plan. Depend on the concrete outputs it
# ships, NOT the deprecated `optics` meta-part (see the optics plan's own
# note). The native .so/.pc/headers from these parts are what the aegis -sys
# build scripts link via pkg-config at build time, and what the built
# compositor dlopen/loaders at runtime.
build_deps = [
    'rust',
    'wayland', 'wayland-protocols',
    'libdrm', 'libxkbcommon', 'libinput', 'seatd',
    'systemd', 'pipewire',
    'vulkan-loader', 'vulkan-headers',
    'pkgconf',
    'optics:flux', 'optics:flux-text', 'optics:flux-scene-graph',
    'optics:lens', 'optics:iris',
]
link_deps = [
    'optics:flux', 'optics:flux-text', 'optics:flux-scene-graph',
    'optics:lens', 'optics:iris',
    'wayland', 'libdrm', 'libxkbcommon', 'libinput', 'seatd',
    'systemd', 'pipewire', 'vulkan-loader',
]

# Single source: aegis only. Since 0.0.5 the workspace Cargo.toml resolves the
# Optics Rust bindings from the locked v0.0.3 git tag (commit 8fa0a0c5) and
# links the C libraries via pkg-config against the installed optics parts
# above — so the build no longer needs a sibling ../optics source checkout, no
# FLUX_BUILD_DIR probe, and no *_USE_INSTALLED override. The -sys build scripts
# fall straight through to system pkg-config.
[[sources]]
type = "git"
url = "https://github.com/ming2k/aegis.git"
ref = "refs/tags/v${VERSION}"
depth = 1
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_TARGET_DIR = '${WORKDIR}/target' }
script = '''
cd source
# --locked: Cargo.lock pins every binding to optics tag v0.0.3 and is committed.
# No sibling ../optics path-deps remain, so the lockfile resolves unchanged.
# Build the whole workspace so all six binaries are produced.
cargo build --locked --release --workspace'''

[pipeline.staging]
script = '''
src="${WORKDIR}/source"
bin="${WORKDIR}/target/release"
out="${STAGING_DIR}/usr"

# Six workspace binaries → /usr/bin.
for b in aegis aegis-settings aegis-ctl aegis-portal aegis-fuji-mcp fuji; do
    install -Dm755 "$bin/$b" "$out/bin/$b"
done

# Desktop entry + icon.
install -Dm644 "$src/contrib/io.github.ming2k.aegis.Settings.desktop" \
    "$out/share/applications/io.github.ming2k.aegis.Settings.desktop"
install -Dm644 "$src/contrib/icons/hicolor/scalable/apps/io.github.ming2k.aegis.Settings.svg" \
    "$out/share/icons/hicolor/scalable/apps/io.github.ming2k.aegis.Settings.svg"

# systemd user unit (ExecStart=/usr/bin/aegis ...). Keep its Delegate=cpu
# memory pids — Realm sandboxing depends on the delegated controllers.
install -Dm644 "$src/contrib/systemd/user/aegis.service" \
    "$out/lib/systemd/user/aegis.service"

# D-Bus activation for the portal backend (Exec=/usr/bin/aegis-portal).
install -Dm644 "$src/contrib/dbus-1/services/org.freedesktop.impl.portal.desktop.aegis.service" \
    "$out/share/dbus-1/services/org.freedesktop.impl.portal.desktop.aegis.service"

# xdg-desktop-portal integration.
install -Dm644 "$src/contrib/xdg-desktop-portal/portals/aegis.portal" \
    "$out/share/xdg-desktop-portal/portals/aegis.portal"
install -Dm644 "$src/contrib/xdg-desktop-portal/aegis-portals.conf" \
    "$out/share/xdg-desktop-portal/aegis-portals.conf"

# Bundled Bibata-Modern-Ice (GPL-3.0) license disclosure. The theme is embedded
# into the aegis binary via include_dir, so its LICENSE/NOTICE must ship too.
install -Dm644 "$src/assets/cursors/Bibata-Modern-Ice/LICENSE" \
    "$out/share/licenses/aegis/Bibata-Modern-Ice/LICENSE"
install -Dm644 "$src/assets/cursors/Bibata-Modern-Ice/NOTICE" \
    "$out/share/licenses/aegis/Bibata-Modern-Ice/NOTICE"'''

[[output]]
runtime_deps = [
    'optics:flux', 'optics:flux-text', 'optics:flux-scene-graph',
    'optics:lens', 'optics:iris',
    'seatd', 'pipewire', 'libinput', 'systemd',
    'wayland', 'libxkbcommon', 'vulkan-loader',
]

[output.hooks]
# Reload the user-unit catalog so the new aegis.service is picked up. Desktop
# and icon caches are refreshed as a courtesy; they are advisory (|| true)
# because these tools may be absent on a minimal wright-managed system.
post_install = '''
systemctl --user daemon-reload 2>/dev/null || true
update-desktop-database -q /usr/share/applications 2>/dev/null || true
gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
'''
post_upgrade = '''
systemctl --user daemon-reload 2>/dev/null || true
update-desktop-database -q /usr/share/applications 2>/dev/null || true
gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
'''
