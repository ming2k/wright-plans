name = "cmark"
version = "0.31.2"
release = 1
description = "CommonMark parsing and rendering library"
license = "BSD-2-Clause"
arch = "x86_64"
url = "https://github.com/commonmark/cmark"


build_deps = ['ninja', 'cmake']

[[sources]]
type = "http"
sha256 = "f9bc5ca38bcb0b727f0056100fac4d743e768872e3bacec7746de28f5700d697"
url = "https://github.com/commonmark/cmark/archive/refs/tags/${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/cmark-${VERSION}
cmake -B build -G Ninja \
  -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_LIBDIR=lib \
  -DBUILD_SHARED_LIBS=ON \
  -DBUILD_TESTING=OFF'''

[pipeline.compile]
script = '''
cd source/cmark-${VERSION}
ninja -C build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/cmark-${VERSION}
DESTDIR=${STAGING_DIR} ninja -C build install'''

