name = "linux"
version = "7.3"
release = 1
description = "The Linux kernel"
license = "GPL-2.0-only"
arch = "x86_64"
url = "https://www.kernel.org/"

# `dwarves` supplies pahole, which Kbuild invokes from scripts/gen-btf.sh to
# convert vmlinux DWARF into the .BTF section. Kconfig additionally gates
# CONFIG_DEBUG_INFO_BTF on PAHOLE_VERSION >= 122, probed from `pahole --version`
# in PATH, so a missing pahole makes `make olddefconfig` drop BTF without any
# diagnostic. Declaring it here guarantees ordering when no isolation is used
# and the host PATH supplies the tool.
build_deps = ['dwarves']

# See README.md for hardware support policy, Arch/CachyOS comparison, and PGO usage


[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${VERSION}.tar.xz"
extract_to = "source"

[[sources]]
sha256 = "SKIP"
type = "local"
path = "config"

# Shared shell helpers sourced by every transaction hook below. Shipping them as
# a plain local source keeps the hook bodies free of duplicated logic; the file
# lands in ${WORKDIR} during prepare and is staged next to the kernel so the
# hooks can source it from a stable installed path.
[[sources]]
sha256 = "SKIP"
type = "local"
path = "kernel-hooks.sh"

[pipeline.prepare]
# The kernel source tree and its toolchain are trusted build inputs, so all three
# stages run without a sandbox. This also keeps `pahole` visible to Kconfig: the
# PAHOLE_VERSION probe happens in this stage, and an isolated root that cannot
# see /usr/bin/pahole would silently drop CONFIG_DEBUG_INFO_BTF.
isolation = "none"
script = '''
cd source/linux-${VERSION}

# Configuration policy:
# - ${WORKDIR}/config is the primary kernel config source and should reflect
#   the baseline that users can inspect and edit directly.
# - Prefer changing config for normal feature choices so the resulting policy is
#   visible in one place.
# - Keep scripts/config usage minimal and limited to a small set of
#   strategy-critical assertions or version-drift guardrails that cannot be
#   expressed cleanly as the maintained config baseline.
# - "Guardrail" means a build-time assertion that intentionally runs every build
#   to prevent silent breakage when config or upstream Kconfig symbols drift.
# - "Baseline sync" means a temporary migration aid. Once a final build .config
#   has been copied back to linux/config and verified, these entries can be
#   removed from plan.toml because the maintained baseline carries the policy.
cp ${WORKDIR}/config .config
make olddefconfig

# ---------------------------------------------------------------------------
# Guardrails: build-time assertions that run every build to prevent silent
# breakage when config baselines or upstream Kconfig symbols drift.
# Each block below documents: (1) the commands, (2) why they are needed,
# and (3) the runtime scenario they protect.
# ---------------------------------------------------------------------------

# --- Package identity ---
# Commands: force LOCALVERSION and DEFAULT_HOSTNAME.
# Principle: package identity must not depend on whatever happens to be in the
# copied baseline .config. These values identify this distro kernel.
# Scenario: every build.
scripts/config --set-str LOCALVERSION "-theseus"
scripts/config --set-str DEFAULT_HOSTNAME "theseus"

# --- 64-bit x86_64 only ---
# Commands: keep the kernel generic across modern x86_64 CPUs, but disable
# IA32 and x32 userspace compatibility.
# Principle: the package should run on normal modern 64-bit Intel/AMD-family
# PCs without being tied to the build host, while deliberately dropping old
# 32-bit ABI support.
# Scenario: desktop/workstation installs that run only native 64-bit userspace.
scripts/config --disable X86_NATIVE_CPU
scripts/config --set-val X86_MINIMUM_CPU_FAMILY 64
scripts/config --enable CPU_SUP_INTEL
scripts/config --enable CPU_SUP_AMD
scripts/config --enable CPU_SUP_HYGON
scripts/config --enable CPU_SUP_CENTAUR
scripts/config --enable CPU_SUP_ZHAOXIN
scripts/config --disable IA32_EMULATION
scripts/config --disable X86_X32_ABI
scripts/config --disable COMPAT
scripts/config --disable COMPAT_32
scripts/config --disable COMPAT_BINFMT_ELF
scripts/config --disable COMPAT_32BIT_TIME
scripts/config --disable MODIFY_LDT_SYSCALL

# --- Boot-critical support (no initramfs, must be built-in) ---
# Commands: enable supported root filesystems, EFI System Partition filesystem,
# NVMe, AHCI/SATA, SCSI disk, xHCI USB, and USB mass storage as built-in
# support (y, not m).
# Principle: without an initramfs the kernel must mount root and access the
# boot partition entirely on its own. If these are modules, the package may
# only boot on the builder's storage layout.
# Scenario: common modern desktop/laptop and rescue-USB boot paths.
scripts/config --enable EXT4_FS
scripts/config --enable BTRFS_FS
scripts/config --enable VFAT_FS
scripts/config --enable NLS_CODEPAGE_437
scripts/config --enable NLS_ISO8859_1
scripts/config --enable NLS_UTF8
scripts/config --enable BLK_DEV_NVME
scripts/config --enable NVME_CORE
scripts/config --enable SCSI
scripts/config --enable BLK_DEV_SD
scripts/config --enable ATA
scripts/config --enable SATA_AHCI
scripts/config --enable USB_XHCI_HCD
scripts/config --enable USB_STORAGE
scripts/config --module XFS_FS
scripts/config --enable EFI
scripts/config --enable EFI_STUB
scripts/config --enable EFI_MIXED
scripts/config --enable EFIVAR_FS
scripts/config --enable EFI_RUNTIME_MAP

# --- systemd hard requirements ---
# Commands: enable cgroups, tmpfs, devtmpfs, autofs, epoll, signalfd, timerfd,
# inotify, and seccomp.
# Principle: systemd documents these as mandatory. Missing any one causes
# startup failure or feature degradation (e.g. missing SECCOMP breaks service
# sandboxing, missing CGROUPS breaks the entire init model).
# Scenario: any system using systemd as PID 1.
scripts/config --enable DEVTMPFS
scripts/config --enable DEVTMPFS_MOUNT
scripts/config --enable CGROUPS
scripts/config --enable INOTIFY_USER
scripts/config --enable SIGNALFD
scripts/config --enable TIMERFD
scripts/config --enable EPOLL
scripts/config --enable AUTOFS_FS
scripts/config --enable TMPFS
scripts/config --enable TMPFS_POSIX_ACL
scripts/config --enable TMPFS_XATTR
scripts/config --enable SECCOMP
scripts/config --enable SECCOMP_FILTER

# --- Container / sandbox support ---
# Commands: enable user namespaces, including unprivileged creation.
# Principle: Flatpak, bwrap, rootless Docker, Chrome sandbox, and modern
# container tooling all require unprivileged user namespaces. The upstream
# Kconfig already provides strong security defaults around this feature.
# Scenario: any desktop or developer workflow that uses sandboxed apps or
# containers.
scripts/config --enable NAMESPACES
scripts/config --enable USER_NS

# --- systemd integration expectations ---
# Commands: enable DMIID, NET, SYSFS, PROC_FS, FHANDLE, BPF_SYSCALL,
# CGROUP_BPF.
# Principle: systemd uses these for hardware identification, network
# management, service supervision, and cgroup-based resource control.
# Scenario: full systemd feature set on a workstation.
scripts/config --enable DMIID
scripts/config --enable NET
scripts/config --enable SYSFS
scripts/config --enable PROC_FS
scripts/config --enable FHANDLE
scripts/config --enable BPF_SYSCALL
scripts/config --enable CGROUP_BPF

# --- Module and network policy ---
# Commands: disable uevent helper, force module signing, disable WEXT.
# Principle:
#   - UEVENT_HELPER conflicts with systemd-udev which is the only supported
#     hotplug manager on this system.
#   - MODULE_SIG_ALL ensures every module is signed at install time; without
#     it, in-tree modules such as pkcs8_key_parser remain unsigned and taint
#     the kernel on first load.
#   - CFG80211_WEXT is the legacy wireless-extensions compat shim. Disabling
#     it prevents applications from silently falling back to the deprecated
#     ioctl path and avoids Wi-Fi 7 regression warnings from cfg80211.
# Scenario: clean systemd + Wayland + modern nl80211-only wireless stack.
scripts/config --disable UEVENT_HELPER
scripts/config --enable MODULE_SIG_ALL
scripts/config --disable CFG80211_WEXT

# --- Intel laptop audio (SOF/DMIC) ---
# Commands: force-enable the entire SOF (Sound Open Firmware) and DMIC
# topology path, both built-in and as modules.
# Principle: upstream Kconfig symbols around SOF change frequently between
# kernel versions. olddefconfig can silently drop symbols and fall back to
# plain HDA, which loses the internal digital microphone array on modern
# Intel laptops.
# Scenario: any Intel-based laptop that uses the SOF audio firmware.
scripts/config --module SND_HDA_INTEL
scripts/config --enable SND_INTEL_NHLT
scripts/config --module SND_INTEL_DSP_CONFIG
scripts/config --module SND_INTEL_SOUNDWIRE_ACPI
scripts/config --module SND_SOC
scripts/config --module SND_SOC_ACPI
scripts/config --module SND_SOC_ACPI_INTEL_MATCH
scripts/config --module SND_SOC_INTEL_AVS
scripts/config --module SND_SOC_INTEL_AVS_MACH_DMIC
scripts/config --module SND_SOC_INTEL_SKL_HDA_DSP_GENERIC_MACH
scripts/config --enable SND_SOC_SOF_TOPLEVEL
scripts/config --module SND_SOC_SOF
scripts/config --module SND_SOC_SOF_PCI_DEV
scripts/config --module SND_SOC_SOF_PCI
scripts/config --module SND_SOC_SOF_ACPI
scripts/config --module SND_SOC_SOF_CLIENT
scripts/config --enable SND_SOC_SOF_INTEL_TOPLEVEL
scripts/config --module SND_SOC_SOF_INTEL_COMMON
scripts/config --module SND_SOC_SOF_INTEL_MTL
scripts/config --module SND_SOC_SOF_METEORLAKE
scripts/config --module SND_SOC_SOF_INTEL_LNL
scripts/config --module SND_SOC_SOF_LUNARLAKE
scripts/config --module SND_SOC_SOF_HDA_COMMON
scripts/config --module SND_SOC_SOF_HDA_GENERIC
scripts/config --module SND_SOC_SOF_HDA_MLINK
scripts/config --enable SND_SOC_SOF_HDA_LINK
scripts/config --enable SND_SOC_SOF_HDA_AUDIO_CODEC
scripts/config --module SND_SOC_SOF_HDA_LINK_BASELINE
scripts/config --module SND_SOC_SOF_HDA
scripts/config --module SND_SOC_SOF_HDA_PROBES
scripts/config --module SND_SOC_SOF_INTEL_SOUNDWIRE
scripts/config --module SND_SOC_SOF_INTEL_SOUNDWIRE_LINK_BASELINE
scripts/config --module SND_SOC_SOF_XTENSA

# --- Intel external device interfaces ---
# Commands: enable SPI bus and Intel SPI PCI controller for Arrow Lake PCH
# SPI flash controller, and enable Intel NPU (Neural Processing Unit) driver.
# Principle: modern Intel laptops expose SPI controller (00:1f.5) for BIOS/TPM
# and NPU (00:0b.0) for AI acceleration. Without these drivers the devices
# appear as unbound in lspci and users see "unknown" external interface errors.
# Scenario: Intel Arrow Lake / Meteor Lake based laptops.
scripts/config --enable SPI
scripts/config --enable SPI_MEM
scripts/config --module SPI_INTEL_PCI
scripts/config --enable DRM_ACCEL
scripts/config --module DRM_ACCEL_IVPU

# --- eBPF CO-RE support (BTF) ---
# Commands: enable DEBUG_KERNEL so the "Debug information" choice is reachable,
# select DWARF5 and BTF (for vmlinux and for modules), and turn SCHED_CLASS_EXT
# back on.
# Principle: eBPF CO-RE programs need /sys/kernel/btf/vmlinux, which is backed by
# the vmlinux .BTF section (kernel/bpf/sysfs_btf.c reads __start_BTF..__stop_BTF).
# Without it, tools that rely on CO-RE fail to start; dae aborts with
# "no BTF found for kernel version ... you should re-compile linux kernel with
# BTF configurations". SCHED_CLASS_EXT additionally declares
# "depends on BPF_SYSCALL && BPF_JIT && DEBUG_INFO_BTF", so it could never be
# enabled while BTF was off, despite being an advertised feature.
# Scenario: dae, bpftrace, and sched_ext (scx) schedulers on any install.
#
# The DEBUG_INFO_BTF symbols are also carried by the config baseline. They are
# repeated here because Kconfig silently drops them whenever pahole is absent
# from PATH (PAHOLE_VERSION becomes 0), so the assertion block below is the only
# thing that turns that silent downgrade into a build failure.
scripts/config --enable DEBUG_KERNEL
scripts/config --disable DEBUG_INFO_NONE
scripts/config --enable DEBUG_INFO_DWARF5
scripts/config --disable DEBUG_INFO_REDUCED
scripts/config --disable DEBUG_INFO_SPLIT
scripts/config --enable DEBUG_INFO_BTF
scripts/config --enable DEBUG_INFO_BTF_MODULES
scripts/config --enable SCHED_CLASS_EXT

# --- Expert-gated hardening ---
# Commands: expose the expert-only knob set, then actually disable
# MODIFY_LDT_SYSCALL.
# Principle: MODIFY_LDT_SYSCALL is declared with `bool ... if EXPERT`. While
# EXPERT is off the prompt is hidden and Kconfig keeps its `default y`, so the
# earlier `--disable MODIFY_LDT_SYSCALL` never took effect and every shipped
# kernel still exposed modify_ldt(2). Enabling EXPERT makes that hardening real;
# the only other semantic change it causes is the related X86_16BIT and
# X86_ESPFIX64 removal, which matches the no-32-bit-userspace policy above.
# Scenario: every build; reduces the x86 syscall attack surface.
scripts/config --enable EXPERT
scripts/config --disable MODIFY_LDT_SYSCALL

make olddefconfig

# ---------------------------------------------------------------------------
# Guardrails for kernel BTF: fail the build instead of silently shipping a
# kernel without BTF. `make olddefconfig` above will already have dropped
# DEBUG_INFO_BTF if pahole was missing or too old, and nothing else in the
# pipeline would notice.
# ---------------------------------------------------------------------------
pahole_ver=$(scripts/pahole-version.sh pahole 2>/dev/null || true)
pahole_ver=${pahole_ver:-0}
case "${pahole_ver}" in
    ''|*[!0-9]*) pahole_ver=0 ;;
esac
if [ "${pahole_ver}" -lt 122 ]; then
    echo "ERROR: pahole >= 1.22 is required for CONFIG_DEBUG_INFO_BTF," >&2
    echo "       detected version code: '${pahole_ver}' (0 means not found in PATH)." >&2
    echo "       Install the 'dwarves' plan and re-run the build." >&2
    exit 1
fi

for sym in DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES SCHED_CLASS_EXT; do
    if ! grep -qx "CONFIG_${sym}=y" .config; then
        echo "ERROR: CONFIG_${sym} did not survive 'make olddefconfig'." >&2
        echo "       A kernel built from this .config has no /sys/kernel/btf," >&2
        echo "       so eBPF CO-RE programs such as dae would refuse to start." >&2
        exit 1
    fi
done
if grep -qx "CONFIG_DEBUG_INFO_REDUCED=y" .config; then
    echo "ERROR: CONFIG_DEBUG_INFO_REDUCED is set; it is incompatible with BTF." >&2
    exit 1
fi
'''

[pipeline.compile]
isolation = "none"
script = '''
cd source/linux-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
isolation = "none"
script = '''
cd source/linux-${VERSION}

# INSTALL_MOD_STRIP=1 maps to `strip --strip-debug`, which removes .debug_* but
# keeps .BTF, so modules stay loadable by CO-RE tooling at 77M instead of 934M.
# Module signatures survive because `make modules_install` signs after stripping.
make INSTALL_MOD_PATH=${STAGING_DIR}/usr INSTALL_MOD_STRIP=1 modules_install
rm -f ${STAGING_DIR}/usr/lib/modules/*/build
install -d ${STAGING_DIR}/boot
cp -v arch/x86/boot/bzImage ${STAGING_DIR}/boot/vmlinuz-theseus
cp -v System.map ${STAGING_DIR}/boot/System.map-theseus
cp -v .config ${STAGING_DIR}/boot/config-theseus

# Installed once, at a version-independent path, because the hooks are stored in
# the part archive rather than in the build tree and cannot reach ${WORKDIR}.
install -Dm644 ${WORKDIR}/kernel-hooks.sh ${STAGING_DIR}/usr/share/linux/kernel-hooks.sh'''

[[output]]
runtime_deps = ['kmod', 'dracut-ng', 'systemd']
backup = ['/boot/config-theseus']

hooks.post_install = '''
# '.' returns non-zero when the library is missing, and the hook runs under
# /bin/sh -e, so a broken install aborts here instead of silently skipping
# kernel registration.
. /usr/share/linux/kernel-hooks.sh
command -v kernel-install >/dev/null 2>&1 || {
    echo ":: ERROR: kernel-install not found; cannot register the kernel" >&2
    exit 1
}
register_kernel
'''

hooks.post_upgrade = '''
. /usr/share/linux/kernel-hooks.sh
command -v kernel-install >/dev/null 2>&1 || {
    echo ":: ERROR: kernel-install not found; cannot register the kernel" >&2
    exit 1
}
register_kernel
prune_orphans
'''

hooks.pre_remove = '''
. /usr/share/linux/kernel-hooks.sh
command -v kernel-install >/dev/null 2>&1 || exit 0

kver=$(kver_installed) || exit 0
# Never remove the boot entry of the kernel the machine is running right now.
if [ "${kver}" = "$(uname -r)" ]; then
    echo ":: Keeping boot entry [${kver}]: it is the running kernel"
    exit 0
fi
echo ":: Removing boot entry [${kver}]"
kernel-install remove "${kver}"
'''
