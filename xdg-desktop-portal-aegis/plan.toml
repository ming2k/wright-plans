name = "xdg-desktop-portal-aegis"
version = "0.0.9"
release = 1
description = "XDG Desktop Portal backend for the Aegis compositor"
license = "MIT AND GPL-3.0-only"
arch = "x86_64"
url = "https://github.com/aegis-shell/xdg-desktop-portal-aegis"

build_deps = ['rust-bin', 'meson', 'ninja', 'pkgconf', 'llvm:clang']
link_deps = [
    'gtk4 >= 4.10', 'pipewire >= 0.3', 'linux-pam',
    'gcc:gcc-libs', 'glibc',
]

[[sources]]
type = "http"
url = "https://github.com/aegis-shell/xdg-desktop-portal-aegis/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "SKIP"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/xdg-desktop-portal-aegis-${VERSION}
# Portal v0.0.4 owns its narrow protocol-24 wire projection. The release
# lockfile contains no Aegis source packages or sibling-checkout overrides.
test ! -e .cargo/config.toml
meson setup build \
    --prefix=/usr \
    --buildtype=release \
    -Dpam=true
'''

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo' }
script = '''
cd source/xdg-desktop-portal-aegis-${VERSION}
meson compile -C build
'''

[pipeline.staging]
script = '''
cd source/xdg-desktop-portal-aegis-${VERSION}
DESTDIR="$STAGING_DIR" meson install -C build
install -Dm644 LICENSE \
    "$STAGING_DIR/usr/share/licenses/xdg-desktop-portal-aegis/LICENSE"
'''

[[output]]
# Aegis is a runtime provider for compositor-owned protocol-24 resources,
# not a source or build dependency. Portal v0.0.4's protocol-24 client is
# wire-compatible with the Aegis v0.0.13 runtime.
runtime_deps = [
    'aegis >= 0.0.13',
    'gtk4 >= 4.10', 'linux-pam', 'pipewire >= 0.3', 'wireplumber',
    'xdg-desktop-portal', 'xdg-desktop-portal-gtk', 'xdg-utils',
    'gcc:gcc-libs', 'glibc',
]
