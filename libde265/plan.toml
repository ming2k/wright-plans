name = "libde265"
version = "1.1.3"
release = 1
description = "Open H.265 video codec implementation"
license = "LGPL-3.0-or-later"
arch = "x86_64"
url = "https://github.com/strukturag/libde265"

build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905"
url = "https://github.com/strukturag/libde265/releases/download/v${VERSION}/libde265-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/*
cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release'''

[pipeline.compile]
script = '''
cd source/*
cmake --build build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/*
DESTDIR=${STAGING_DIR} cmake --install build'''

[[output]]
runtime_deps = ['glibc']
