name = "intel-gmmlib"
version = "22.10.2"
release = 1
description = "Intel Graphics Memory Management Library"
license = "MIT"
arch = "x86_64"
url = "https://github.com/intel/gmmlib"

link_deps = ['glibc']
build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "94d0038ef92bb65b86d08f004197c56f8d81f82f9ac7a25c202a88afd653a30b"
url = "https://github.com/intel/gmmlib/archive/intel-gmmlib-${VERSION}/intel-gmmlib-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/*
cmake -B build \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF'''

[pipeline.compile]
script = '''
cd source/*
cmake --build build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/*
DESTDIR=${STAGING_DIR} cmake --install build'''

[[output]]
runtime_deps = ['glibc']
