name = "tree-sitter-cli"
version = "0.27.0"
release = 1
description = "CLI tool for developing, testing, and using Tree-sitter parsers"
license = "MIT"
arch = "x86_64"
url = "https://github.com/tree-sitter/tree-sitter"

link_deps = ['gcc:gcc-libs', 'glibc']
build_deps = ['rust-bin']

[[sources]]
type = "http"
sha256 = "d35c96e68736bd9569d2757c3cc71052485f33082c3825f1aed9d0e86013a159"
url = "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
script = '''
cd source/tree-sitter-cli-${VERSION}
cargo build --release --locked -p tree-sitter-cli'''

[pipeline.staging]
script = '''
cd source/tree-sitter-cli-${VERSION}
install -Dm755 target/release/tree-sitter ${STAGING_DIR}/usr/bin/tree-sitter'''

[[output]]
runtime_deps = ['gcc:gcc-libs', 'glibc']
