name = "libunwind"
version = "1.8.3"
release = 1
description = "Portable and efficient C programming interface (API) to determine the call-chain of a program"
license = "MIT"
arch = "x86_64"


[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://github.com/libunwind/libunwind/releases/download/v${VERSION}/libunwind-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libunwind-${VERSION}
# Keep 'unreachable' redefinition warnings non-fatal and use GNU99 for compatibility.
export CFLAGS="$CFLAGS -Wno-error -std=gnu99"

./configure --prefix=/usr --libdir=/usr/lib --disable-static

# The bundled tests fail to compile, so exclude them from build recursion.
sed -i 's/ tests//g' Makefile'''

[pipeline.compile]
script = '''
cd source/libunwind-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libunwind-${VERSION}
make DESTDIR=${STAGING_DIR} install'''
