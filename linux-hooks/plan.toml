name = "linux-hooks"
version = "1.2.0"
release = 1
description = "Shared boot-entry and kconfig assertion helpers for Theseus kernel plans"
license = "GPL-2.0-only"
arch = "x86_64"
url = "https://github.com/ming2k/wright"

# Header-only package: it ships two shell libraries and nothing else.
#
# 1. /usr/share/linux/kernel-hooks.sh
#    Shared boot-entry lifecycle management (register_kernel, prune_retired_kernels,
#    remove_kernel). Enforces the Keep-1 policy (target kernel + running kernel
#    protected, older versions retired from ESP and /usr/lib/modules).
#
# 2. /usr/share/linux/kconfig-assert.sh
#    Shared build-time assertion library (kassert_y, kassert_m, kassert_n,
#    kassert_str, kassert_val). Separates SET from ASSERT so plan.toml cannot
#    silently override maintainer edits in config.

[[sources]]
sha256 = "SKIP"
type = "local"
path = "kernel-hooks.sh"

[[sources]]
sha256 = "SKIP"
type = "local"
path = "kconfig-assert.sh"

[pipeline.staging]
script = '''
# Version-independent paths, since hooks and prepare scripts source them from
# standard system locations.
install -Dm644 ${WORKDIR}/kernel-hooks.sh ${STAGING_DIR}/usr/share/linux/kernel-hooks.sh
install -Dm644 ${WORKDIR}/kconfig-assert.sh ${STAGING_DIR}/usr/share/linux/kconfig-assert.sh'''

[[output]]
# No runtime dependencies on purpose: the library is plain POSIX sh and relies
# only on kernel-install, which the kernel plans already require directly.
