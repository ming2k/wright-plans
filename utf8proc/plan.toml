name = "utf8proc"
version = "2.12.0"
release = 1
description = "UTF-8 processing library"
license = "MIT"
arch = "x86_64"
url = "https://github.com/JuliaStrings/utf8proc"

build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "f564011d38b2888d583d510b08e69ffa15aa117155db1b9b49ef1dfe1fa25111"
url = "https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/utf8proc-${VERSION}
echo "cmake project"'''

[pipeline.compile]
script = '''
cd source/utf8proc-${VERSION}
mkdir -p build && cd build
cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/utf8proc-${VERSION}/build
DESTDIR=${STAGING_DIR} make install'''
