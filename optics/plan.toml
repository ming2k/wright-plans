name = "optics"
version = "0.0.10"
release = 1
description = "Optics rendering libraries: flux, flux-text, flux-scene-graph, lens, and iris"
license = "MIT"
arch = "x86_64"
url = "https://github.com/ming2k/optics"

build_deps = [
    'meson', 'ninja', 'glslang', 'pkgconf',
    'vulkan-headers', 'wayland-protocols',
]
link_deps = [
    'vulkan-loader', 'wayland', 'libxkbcommon', 'systemd',
    'fontconfig', 'harfbuzz', 'freetype', 'fribidi', 'glibc',
]

[[sources]]
type = "http"
url = "https://github.com/ming2k/optics/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "53e310ed57998c8180b40a0c8a441df67935c238772a7e147e9e94ca51c09d5f"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/optics-${VERSION}
meson setup build --prefix=/usr --buildtype=release \
    -Dcanvas=true \
    -Dscene=true \
    -Dtext=true \
    -Dscene-graph=true \
    -Dcompute=true \
    -Deffect=true \
    -Dexamples=false \
    -Dtests=false
'''

[pipeline.compile]
script = '''
cd source/optics-${VERSION}
meson compile -C build
'''

[pipeline.staging]
script = '''
cd source/optics-${VERSION}
DESTDIR="$STAGING_DIR" meson install -C build
'''

[[output]]
name = "flux"
description = "libflux Vulkan-first graphics library"
include = [
    "/usr/include/flux/**",
    "/usr/lib/libflux.so",
    "/usr/lib/libflux.so.*",
    "/usr/lib/pkgconfig/flux.pc",
]
runtime_deps = ['glibc', 'vulkan-loader']
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "flux-text"
description = "libflux_text HarfBuzz shaping sibling of flux"
include = [
    "/usr/include/flux-text/**",
    "/usr/lib/libflux_text.so",
    "/usr/lib/pkgconfig/flux-text.pc",
]
runtime_deps = [
    'optics:flux = 0.0.10',
    'freetype', 'harfbuzz', 'fontconfig', 'fribidi', 'glibc',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "flux-scene-graph"
description = "libflux_scene_graph glTF/scene-graph sibling of flux"
include = [
    "/usr/include/flux-scene-graph/**",
    "/usr/lib/libflux_scene_graph.so",
    "/usr/lib/pkgconfig/flux-scene-graph.pc",
]
runtime_deps = ['optics:flux = 0.0.10', 'glibc']
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "lens"
description = "liblens immediate-mode UI over a retained core"
include = [
    "/usr/include/lens/**",
    "/usr/lib/liblens.so",
    "/usr/lib/liblens.so.*",
    "/usr/lib/pkgconfig/lens.pc",
]
runtime_deps = [
    'optics:flux = 0.0.10',
    'optics:flux-text = 0.0.10',
    'glibc',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "iris"
description = "libiris windowing/UI layer over lens"
include = [
    "/usr/include/iris/**",
    "/usr/lib/libiris.so",
    "/usr/lib/libiris.so.*",
    "/usr/lib/pkgconfig/iris.pc",
]
runtime_deps = [
    'optics:lens = 0.0.10',
    'systemd', 'wayland', 'libxkbcommon', 'vulkan-loader', 'glibc',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

# This plan intentionally has no catch-all "optics" output. Consumers depend
# on the concrete outputs they link: optics:flux, optics:flux-text,
# optics:flux-scene-graph, optics:lens, and optics:iris.
