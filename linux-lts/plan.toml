name = "linux-lts"
version = "6.18.59"
release = 1
description = "The Linux kernel (LTS)"
license = "GPL-2.0-only"
arch = "x86_64"
url = "https://www.kernel.org/"

# `dwarves` supplies pahole, which Kbuild invokes to convert vmlinux DWARF into
# the .BTF section. Kconfig additionally gates CONFIG_DEBUG_INFO_BTF on
# PAHOLE_VERSION, probed from `pahole --version` in PATH, so a missing pahole
# makes `make olddefconfig` drop BTF without any diagnostic. Declaring it here
# guarantees ordering when no isolation is used and the host PATH supplies the
# tool.
build_deps = ['dwarves']

[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz"
extract_to = "source"

[[sources]]
sha256 = "SKIP"
type = "local"
path = "config"

# Build-time only assertion library. Used during pipeline.prepare to verify
# that the baseline config is preserved, but NOT staged into the runtime package.
[[sources]]
sha256 = "SKIP"
type = "local"
path = "kconfig-assert.sh"

# Shared boot-entry helpers for transaction hooks. Staged to /usr/share/linux-lts/
# so post_install, post_upgrade and pre_remove can source them.
[[sources]]
sha256 = "SKIP"
type = "local"
path = "kernel-hooks.sh"

[pipeline.prepare]
# The kernel source tree and its toolchain are trusted build inputs, so all three
# stages run without a sandbox. This also keeps `pahole` visible to Kconfig: the
# PAHOLE_VERSION probe happens in this stage, and an isolated root that cannot
# see /usr/bin/pahole would silently drop CONFIG_DEBUG_INFO_BTF.
isolation = "none"
script = '''
cd source/linux-${VERSION}

# Configuration policy:
# - ${WORKDIR}/config is the primary kernel config source and should reflect
#   the baseline that users can inspect and edit directly.
# - Prefer changing config for normal feature choices so the resulting policy is
#   visible in one place.
# - Keep scripts/config usage minimal and limited to a small set of
#   strategy-critical assertions or version-drift guardrails that cannot be
#   expressed cleanly as the maintained config baseline.
# - "Guardrail" means a build-time assertion that intentionally runs every build
#   to prevent silent breakage when config or upstream Kconfig symbols drift.
# - "Baseline sync" means a temporary migration aid. Once a final build .config
#   has been copied back to linux-lts/config and verified, these entries can be
#   removed from plan.toml because the maintained baseline carries the policy.
cp ${WORKDIR}/config .config
make olddefconfig

# ---------------------------------------------------------------------------
# SET vs ASSERT.
#
# The baseline `config` is the single source of truth for normal feature
# choices. Only two kinds of entry remain below as `scripts/config`:
#
#   SET    -- a value that cannot come from the shared baseline because it is
#             per-plan identity (LOCALVERSION, DEFAULT_HOSTNAME) or a
#             build-host-independent floor, and derived symbols that Kconfig
#             computes from an already-disabled parent.
#   ASSERT -- everything else. `kassert_*` requires the value that `config`
#             already carries and aborts the build when it did not survive
#             `make olddefconfig`, but it never writes. That keeps `config`
#             authoritative: a maintainer who changes an option in `config` sees
#             either the change take effect or an explicit build failure, never a
#             silent override.
#
# Before this split, every option was re-applied with `scripts/config --enable`,
# which meant 105 of 109 entries merely restated `config` and any edit to
# `config` was silently vetoed by the plan.
# ---------------------------------------------------------------------------
. ${WORKDIR}/kconfig-assert.sh

# ---------------------------------------------------------------------------
# Guardrails: build-time assertions that run every build to prevent silent
# breakage when config baselines or upstream Kconfig symbols drift.
# Each block below documents: (1) the commands, (2) why they are needed,
# and (3) the runtime scenario they protect.
# ---------------------------------------------------------------------------

# --- Package identity ---
# Commands: force LOCALVERSION and DEFAULT_HOSTNAME.
# Principle: package identity must not depend on whatever happens to be in the
# copied baseline .config. These values identify this distro kernel.
# Scenario: every build.
scripts/config --set-str LOCALVERSION "-theseus-lts"
scripts/config --set-str DEFAULT_HOSTNAME "theseus"

# --- 64-bit x86_64 only ---
# Commands: keep the kernel generic across modern x86_64 CPUs, but disable
# IA32 and x32 userspace compatibility.
# Principle: the package should run on normal modern 64-bit Intel/AMD-family
# PCs without being tied to the build host, while deliberately dropping old
# 32-bit ABI support.
# Scenario: desktop/workstation installs that run only native 64-bit userspace.
kassert_n \
    X86_NATIVE_CPU
scripts/config --set-val X86_MINIMUM_CPU_FAMILY 64
kassert_y \
    CPU_SUP_INTEL \
    CPU_SUP_AMD \
    CPU_SUP_HYGON \
    CPU_SUP_CENTAUR \
    CPU_SUP_ZHAOXIN
kassert_n \
    IA32_EMULATION \
    X86_X32_ABI
scripts/config --disable COMPAT
scripts/config --disable COMPAT_32
scripts/config --disable COMPAT_BINFMT_ELF
scripts/config --disable COMPAT_32BIT_TIME
# MODIFY_LDT_SYSCALL is deliberately NOT disabled here: it is declared
# `bool ... if EXPERT`, so while EXPERT is off the prompt is hidden and Kconfig
# keeps its `default y`. A `--disable` at this point is silently ignored. The
# real fix lives in the "Expert-gated hardening" block near the end of this
# script, which enables EXPERT first.

# --- Boot-critical support (no initramfs, must be built-in) ---
# Commands: enable supported root filesystems, EFI System Partition filesystem,
# NVMe, AHCI/SATA, SCSI disk, xHCI USB, and USB mass storage as built-in
# support (y, not m).
# Principle: without an initramfs the kernel must mount root and access the
# boot partition entirely on its own. If these are modules, the package may
# only boot on the builder's storage layout.
# Scenario: common modern desktop/laptop and rescue-USB boot paths.
kassert_y \
    EXT4_FS \
    BTRFS_FS \
    VFAT_FS \
    NLS_CODEPAGE_437 \
    NLS_ISO8859_1 \
    NLS_UTF8 \
    BLK_DEV_NVME \
    NVME_CORE \
    SCSI \
    BLK_DEV_SD \
    ATA \
    SATA_AHCI \
    USB_XHCI_HCD \
    USB_STORAGE

kassert_y \
    EFI \
    EFI_STUB \
    EFI_MIXED \
    EFIVAR_FS \
    EFI_RUNTIME_MAP
kassert_m \
    XFS_FS
# --- systemd hard requirements ---
# Commands: enable cgroups, tmpfs, devtmpfs, autofs, epoll, signalfd, timerfd,
# inotify, and seccomp.
# Principle: systemd documents these as mandatory. Missing any one causes
# startup failure or feature degradation (e.g. missing SECCOMP breaks service
# sandboxing, missing CGROUPS breaks the entire init model).
# Scenario: any system using systemd as PID 1.

kassert_y \
    DEVTMPFS \
    DEVTMPFS_MOUNT \
    CGROUPS \
    INOTIFY_USER \
    SIGNALFD \
    TIMERFD \
    EPOLL \
    AUTOFS_FS \
    TMPFS \
    TMPFS_POSIX_ACL \
    TMPFS_XATTR \
    SECCOMP \
    SECCOMP_FILTER
# --- Container / sandbox support ---
# Commands: enable user namespaces, including unprivileged creation.
# Principle: Flatpak, bwrap, rootless Docker, Chrome sandbox, and modern
# container tooling all require unprivileged user namespaces. The upstream
# Kconfig already provides strong security defaults around this feature.
# Scenario: any desktop or developer workflow that uses sandboxed apps or
# containers.
#
# Do not add `--enable USER_NS_UNPRIVILEGED` here. That symbol belongs to the
# Arch/ZEN patch set and does not exist in upstream 6.18 (verified against
# init/Kconfig). `scripts/config` would still append a CONFIG_USER_NS_UNPRIVILEGED
# line to .config, and `make olddefconfig` would silently delete it again, so the
# line had no effect on any shipped kernel. Upstream gates unprivileged userns
# creation through the kernel.unprivileged_userns_clone sysctl instead.

kassert_y \
    NAMESPACES \
    USER_NS
# --- systemd integration expectations ---
# Commands: enable DMIID, NET, SYSFS, PROC_FS, FHANDLE, BPF_SYSCALL,
# CGROUP_BPF.
# Principle: systemd uses these for hardware identification, network
# management, service supervision, and cgroup-based resource control.
# Scenario: full systemd feature set on a workstation.

kassert_y \
    DMIID \
    NET \
    SYSFS \
    PROC_FS \
    FHANDLE \
    BPF_SYSCALL \
    CGROUP_BPF
# --- Module and network policy ---
# Commands: disable uevent helper, force module signing, disable WEXT.
# Principle:
#   - UEVENT_HELPER conflicts with systemd-udev which is the only supported
#     hotplug manager on this system.
#   - MODULE_SIG_ALL ensures every module is signed at install time; without
#     it, in-tree modules such as pkcs8_key_parser remain unsigned and taint
#     the kernel on first load.
#   - CFG80211_WEXT is the legacy wireless-extensions compat shim. Disabling
#     it prevents applications from silently falling back to the deprecated
#     ioctl path and avoids Wi-Fi 7 regression warnings from cfg80211.
# Scenario: clean systemd + Wayland + modern nl80211-only wireless stack.
kassert_y \
    MODULE_SIG_ALL

kassert_n \
    UEVENT_HELPER \
    CFG80211_WEXT
# --- Intel laptop audio (SOF/DMIC) ---
# Commands: force-enable the entire SOF (Sound Open Firmware) and DMIC
# topology path, both built-in and as modules.
# Principle: upstream Kconfig symbols around SOF change frequently between
# kernel versions. olddefconfig can silently drop symbols and fall back to
# plain HDA, which loses the internal digital microphone array on modern
# Intel laptops.
# Scenario: any Intel-based laptop that uses the SOF audio firmware.
kassert_y \
    SND_INTEL_NHLT
kassert_y \
    SND_SOC_SOF_TOPLEVEL
kassert_y \
    SND_SOC_SOF_INTEL_TOPLEVEL
kassert_y \
    SND_SOC_SOF_HDA_LINK \
    SND_SOC_SOF_HDA_AUDIO_CODEC

kassert_m \
    SND_HDA_INTEL \
    SND_INTEL_DSP_CONFIG \
    SND_INTEL_SOUNDWIRE_ACPI \
    SND_SOC \
    SND_SOC_ACPI \
    SND_SOC_ACPI_INTEL_MATCH \
    SND_SOC_INTEL_AVS \
    SND_SOC_INTEL_AVS_MACH_DMIC \
    SND_SOC_INTEL_SKL_HDA_DSP_GENERIC_MACH \
    SND_SOC_SOF \
    SND_SOC_SOF_PCI_DEV \
    SND_SOC_SOF_PCI \
    SND_SOC_SOF_ACPI \
    SND_SOC_SOF_CLIENT \
    SND_SOC_SOF_INTEL_COMMON \
    SND_SOC_SOF_INTEL_MTL \
    SND_SOC_SOF_METEORLAKE \
    SND_SOC_SOF_INTEL_LNL \
    SND_SOC_SOF_LUNARLAKE \
    SND_SOC_SOF_HDA_COMMON \
    SND_SOC_SOF_HDA_GENERIC \
    SND_SOC_SOF_HDA_MLINK \
    SND_SOC_SOF_HDA_LINK_BASELINE \
    SND_SOC_SOF_HDA \
    SND_SOC_SOF_HDA_PROBES \
    SND_SOC_SOF_INTEL_SOUNDWIRE \
    SND_SOC_SOF_INTEL_SOUNDWIRE_LINK_BASELINE \
    SND_SOC_SOF_XTENSA
# --- Intel external device interfaces ---
# Commands: enable SPI bus and Intel SPI PCI controller for Arrow Lake PCH
# SPI flash controller, and enable Intel NPU (Neural Processing Unit) driver.
# Principle: modern Intel laptops expose SPI controller (00:1f.5) for BIOS/TPM
# and NPU (00:0b.0) for AI acceleration. Without these drivers the devices
# appear as unbound in lspci and users see "unknown" external interface errors.
# Scenario: Intel Arrow Lake / Meteor Lake based laptops.
kassert_y \
    SPI \
    SPI_MEM
kassert_y \
    DRM_ACCEL

kassert_m \
    SPI_INTEL_PCI \
    DRM_ACCEL_IVPU
# --- eBPF CO-RE support (BTF) ---
# Commands: enable DEBUG_KERNEL so the "Debug information" choice is reachable,
# select DWARF5 and BTF (for vmlinux and for modules), and turn SCHED_CLASS_EXT
# back on.
# Principle: eBPF CO-RE programs need /sys/kernel/btf/vmlinux, which is backed by
# the vmlinux .BTF section (kernel/bpf/sysfs_btf.c reads __start_BTF..__stop_BTF).
# Without it, tools that rely on CO-RE fail to start; dae aborts with
# "no BTF found for kernel version ... you should re-compile linux kernel with
# BTF configurations". SCHED_CLASS_EXT declares
# "depends on BPF_SYSCALL && BPF_JIT && DEBUG_INFO_BTF", so it can only be
# enabled while BTF is on.
# Scenario: dae, bpftrace, and sched_ext (scx) schedulers on any install.
#
# The DEBUG_INFO_BTF symbols are also carried by the config baseline. They are
# repeated here because Kconfig silently drops them whenever pahole is absent
# from PATH (PAHOLE_VERSION becomes 0), so the assertion block below is the only
# thing that turns that silent downgrade into a build failure.
kassert_y \
    DEBUG_KERNEL
kassert_y \
    DEBUG_INFO_DWARF5

kassert_y \
    DEBUG_INFO_BTF \
    DEBUG_INFO_BTF_MODULES \
    SCHED_CLASS_EXT
kassert_n \
    DEBUG_INFO_NONE \
    DEBUG_INFO_REDUCED \
    DEBUG_INFO_SPLIT
# --- Expert-gated hardening ---
# Commands: expose the expert-only knob set, then actually disable
# MODIFY_LDT_SYSCALL, while explicitly turning off the debug options that
# EXPERT drags in.
# Principle: MODIFY_LDT_SYSCALL is declared with `bool ... if EXPERT`. While
# EXPERT is off the prompt is hidden and Kconfig keeps its `default y`, which is
# why the earlier `--disable` never took effect and the shipped 6.18.44 kernel
# still exposed modify_ldt(2). Enabling EXPERT makes that hardening real.
#
# EXPERT carries `select DEBUG_KERNEL` ("Unhide debug options"), and DEBUG_KERNEL
# has several `default y` children with real runtime cost, so they are disabled
# explicitly here. Measured on 6.18.59 with `make olddefconfig`: EXPERT alone
# turns on X86_DEBUG_FPU ("adds some small amount of runtime overhead"), RCU_TRACE
# and DEBUG_MISC. All three stay off once named on the command line, and the
# DEBUG_KERNEL they depend on is required for the BTF choice above anyway.
#
# Side effect worth recording: MEDIA_HIDE_ANCILLARY_SUBDRV is
# `default y if MEDIA_SUBDRV_AUTOSELECT && !EXPERT`, so with EXPERT on that
# auto-hide disappears and a block of media I2C tuner/demod options becomes
# visible again, each falling back to its own default. Those defaults are
# unchanged from 6.18.44, but the diff is larger than "only X86_16BIT and
# X86_ESPFIX64 disappear", so re-check the resulting .config after an upgrade.
#
# X86_16BIT and X86_ESPFIX64 disappear as a consequence: both are
# `default y ... depends on MODIFY_LDT_SYSCALL`, so dropping the LDT drops them.
# Scenario: every build; reduces the x86 syscall attack surface.
kassert_y \
    EXPERT

make olddefconfig

kassert_n \
    MODIFY_LDT_SYSCALL \
    X86_DEBUG_FPU \
    RCU_TRACE \
    DEBUG_MISC
# ---------------------------------------------------------------------------
# Guardrails for kernel BTF: fail the build instead of silently shipping a
# kernel without BTF. `make olddefconfig` above will already have dropped
# DEBUG_INFO_BTF if pahole was missing or too old, and nothing else in the
# pipeline would notice.
#
# Threshold note: 6.18 gates BTF on PAHOLE_VERSION >= 116 plus
# (DEBUG_INFO_DWARF4 || PAHOLE_VERSION >= 121). The check below uses the stricter
# 122 that 7.3 requires. That is deliberate: the shipped `dwarves` plan provides
# 1.32 (PAHOLE_VERSION 132), so the stricter bound never rejects a valid build,
# and it keeps this plan and the `linux` plan asserting the same invariant.
# ---------------------------------------------------------------------------
pahole_ver=$(scripts/pahole-version.sh pahole 2>/dev/null || true)
pahole_ver=${pahole_ver:-0}
case "${pahole_ver}" in
    ''|*[!0-9]*) pahole_ver=0 ;;
esac
if [ "${pahole_ver}" -lt 122 ]; then
    echo "ERROR: pahole >= 1.22 is required for CONFIG_DEBUG_INFO_BTF," >&2
    echo "       detected version code: '${pahole_ver}' (0 means not found in PATH)." >&2
    echo "       Install the 'dwarves' plan and re-run the build." >&2
    exit 1
fi

kassert_y DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES SCHED_CLASS_EXT
kassert_n DEBUG_INFO_REDUCED DEBUG_INFO_SPLIT

# Guardrail for the expert-gated hardening: MODIFY_LDT_SYSCALL must actually be
# gone. Without this, a future Kconfig reshuffle could silently restore the
# syscall and nothing in the build would notice, which is exactly how the
# previous `--disable` rotted.
kassert_n MODIFY_LDT_SYSCALL
'''

[pipeline.compile]
isolation = "none"
script = '''
cd source/linux-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
isolation = "none"
script = '''
cd source/linux-${VERSION}

# INSTALL_MOD_STRIP=1 maps to `strip --strip-debug`, which removes .debug_* but
# keeps .BTF, so modules stay loadable by CO-RE tooling instead of landing as a
# ~900M tree. Module signatures survive because modules_install signs after
# stripping.
make INSTALL_MOD_PATH=${STAGING_DIR}/usr INSTALL_MOD_STRIP=1 modules_install
rm -f ${STAGING_DIR}/usr/lib/modules/*/build
install -d ${STAGING_DIR}/boot
cp -v arch/x86/boot/bzImage ${STAGING_DIR}/boot/vmlinuz-theseus-lts
cp -v System.map ${STAGING_DIR}/boot/System.map-theseus-lts
cp -v .config ${STAGING_DIR}/boot/config-theseus-lts

# Installed once, at a version-independent path, because the hooks are stored in
# the part archive rather than in the build tree and cannot reach ${WORKDIR}.
install -Dm644 ${WORKDIR}/kernel-hooks.sh ${STAGING_DIR}/usr/share/linux-lts/kernel-hooks.sh'''

[[output]]
runtime_deps = ['kmod', 'dracut-ng', 'systemd']
backup = ['/boot/config-theseus-lts']

# All three hooks set LINUX_LOCALVERSION before sourcing the shared library: the
# helper anchors both its module glob and its boot-entry regex on that suffix, so
# `linux-lts` can never register or prune an entry belonging to `linux`. This
# matters because "-theseus" is a prefix of "-theseus-lts", so a naive prefix
# match in either direction would let one kernel claim the other's boot entry.
#
# Note that no hook reads ${VERSION}. The plan version ("6.18.59") is not the
# kernel release ("6.18.59-theseus-lts"), and for a plan whose version omits the
# sublevel they diverge outright, so only the installed module directory can name
# a kernel.
hooks.post_install = '''
LINUX_LOCALVERSION="-theseus-lts"
LINUX_IMAGE="/boot/vmlinuz-theseus-lts"
# '.' returns non-zero when the library is missing, and the hook runs under
# /bin/sh -e, so a broken install aborts here instead of silently skipping
# kernel registration.
. /usr/share/linux-lts/kernel-hooks.sh
require_kernel_install
register_kernel
'''

hooks.post_upgrade = '''
LINUX_LOCALVERSION="-theseus-lts"
LINUX_IMAGE="/boot/vmlinuz-theseus-lts"
. /usr/share/linux-lts/kernel-hooks.sh
require_kernel_install
register_kernel
prune_retired_kernels
'''

hooks.pre_remove = '''
LINUX_LOCALVERSION="-theseus-lts"
. /usr/share/linux-lts/kernel-hooks.sh
# A machine without kernel-install has no managed boot entry to remove, so
# returning success here is correct rather than a silent skip.
require_kernel_install || exit 0
remove_kernel
'''
