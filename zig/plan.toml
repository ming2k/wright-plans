name = "zig"
version = "0.16.0"
release = 1
description = "General-purpose programming language and build system"
license = "MIT"
arch = "x86_64"
url = "https://ziglang.org"

[[sources]]
type = "http"
sha256 = "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
url = "https://ziglang.org/download/${VERSION}/zig-x86_64-linux-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/zig-x86_64-linux-${VERSION}
'''

[pipeline.compile]
script = '''
cd source/zig-x86_64-linux-${VERSION}
'''

[pipeline.staging]
script = '''
cd source/zig-x86_64-linux-${VERSION}
install -dm755 ${STAGING_DIR}/usr/lib/zig
cp -a ./* ${STAGING_DIR}/usr/lib/zig/

install -dm755 ${STAGING_DIR}/usr/bin
ln -sf /usr/lib/zig/zig ${STAGING_DIR}/usr/bin/zig
'''

[[output]]
conflicts = ["zig"]
