name = "udisks2"
version = "2.11.2"
release = 1
description = "Disk management service"
license = "GPL-2.0-or-later"
arch = "x86_64"
url = "https://www.freedesktop.org/wiki/Software/udisks/"

link_deps = ['acl', 'libatasmart', 'libblockdev', 'libgudev', 'polkit', 'systemd']

[[sources]]
type = "http"
sha256 = "18630a8aad806bea0bc626ce97e71e50ec82c742956ac1c834a4275f8f22207b"
url = "https://github.com/storaged-project/udisks/releases/download/udisks-${VERSION}/udisks-${VERSION}.tar.bz2"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/udisks2-${VERSION}
./configure \
  --prefix=/usr \
  --sbindir=/usr/bin \
  --sysconfdir=/etc \
  --disable-static \
  --with-udevdir=/usr/lib/udev \
  --enable-lvm2 \
  --enable-btrfs'''

[pipeline.compile]
script = '''
cd source/udisks2-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/udisks2-${VERSION}
make DESTDIR=${STAGING_DIR} install
install -dm750 ${STAGING_DIR}/var/lib/udisks2'''

[[output]]
runtime_deps = ['acl', 'libatasmart', 'libblockdev', 'libgudev', 'polkit', 'systemd']
