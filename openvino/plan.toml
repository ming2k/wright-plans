name = "openvino"
version = "2026.2.0"
release = 4
description = "Intel OpenVINO Toolkit for deep learning inference"
license = "Apache-2.0"
arch = "x86_64"
url = "https://github.com/openvinotoolkit/openvino"

link_deps = [
  'glibc',
  'gcc:gcc-libs',
  'gcc:libstdc++',
  'intel-compute-runtime',
  'level-zero',
  'ocl-icd',
  'zlib',
  'zstd',
]
build_deps = [
  'cmake',
  'ninja',
  'pkgconf',
  'python',
  'git',
]

[[sources]]
type = "git"
url = "https://github.com/openvinotoolkit/openvino.git"
ref = "${VERSION}"
submodules = true
extract_to = "source"

[[sources]]
type = "http"
url = "https://storage.openvinotoolkit.org/dependencies/thirdparty/linux/oneapi-tbb-2021.13.1-lin-release.tgz"
sha256 = "93cf8ada4793044697f76179247c6a35ca0e47ee2a3a228fc9ed91703aa79730"
extract_to = "source/temp"

[[sources]]
type = "local"
path = "query-device.cpp"

[pipeline.prepare]
script = '''
sed -i 's/NOT ENABLE_SYSTEM_TBB/FALSE/g' source/src/cmake/install_tbb.cmake
sed -i 's|runtime/3rdparty/tbb|share/openvino/tbb|g' source/src/cmake/install_tbb.cmake
'''

[pipeline.configure]
script = '''
cd source
cmake -B build -G Ninja \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_INSTALL_LIBDIR=lib \
  -DCMAKE_INSTALL_INCLUDEDIR=include \
  -DCPACK_GENERATOR=BREW \
  -DENABLE_PYTHON=OFF \
  -DENABLE_JS=OFF \
  -DENABLE_TESTS=OFF \
  -DENABLE_SAMPLES=OFF \
  -DTBBROOT=${WORKDIR}/source/temp/tbb \
  -DTBB_DIR=${WORKDIR}/source/temp/tbb/lib/cmake/TBB \
  -DENABLE_TBBBIND_2_5=OFF \
  -DENABLE_SYSTEM_PROTOBUF=OFF \
  -DENABLE_SYSTEM_SNAPPY=OFF \
  -DENABLE_SYSTEM_FLATBUFFERS=OFF \
  -DENABLE_SYSTEM_PUGIXML=OFF \
  -DENABLE_SYSTEM_TBB=OFF \
  -DENABLE_SYSTEM_OPENCL=OFF \
  -DENABLE_SYSTEM_LEVEL_ZERO=OFF \
  -DENABLE_NCC_STYLE=OFF \
  -DENABLE_CLANG_FORMAT=OFF \
  -DENABLE_INTEL_CPU=ON \
  -DENABLE_INTEL_GPU=ON \
  -DENABLE_INTEL_NPU=ON \
  -DENABLE_OV_ONNX_FRONTEND=ON \
  -DENABLE_OV_PADDLE_FRONTEND=OFF \
  -DENABLE_OV_PYTORCH_FRONTEND=OFF \
  -DENABLE_OV_TF_FRONTEND=OFF \
  -DENABLE_OV_TF_LITE_FRONTEND=OFF
'''

[pipeline.compile]
script = '''
cd source
cmake --build build -j$(nproc)
c++ -std=c++17 -O2 \
  -Isrc/core/include -Isrc/inference/include -Iinclude \
  "${WORKDIR}/query-device.cpp" \
  -Lbin/intel64/Release -Ltemp/tbb/lib \
  -lopenvino -ltbb -Wl,-rpath-link,temp/tbb/lib \
  -o openvino-query-device
'''

[pipeline.check]
script = '''
cd source
LD_LIBRARY_PATH=bin/intel64/Release:temp/tbb/lib \
  ./openvino-query-device | grep -q '^CPU$'
'''

[pipeline.staging]
script = '''
cd source
DESTDIR=${STAGING_DIR} cmake --install build

mkdir -p "${STAGING_DIR}/usr/share/openvino/tbb"
cp -a temp/tbb/* "${STAGING_DIR}/usr/share/openvino/tbb/"

mkdir -p "${STAGING_DIR}/usr/lib"
cp -a temp/tbb/lib/lib*.so* "${STAGING_DIR}/usr/lib/"

install -Dm755 openvino-query-device "${STAGING_DIR}/usr/bin/openvino-query-device"
'''

[[output]]
runtime_deps = [
  'glibc',
  'gcc:gcc-libs',
  'gcc:libstdc++',
  'intel-compute-runtime',
  'level-zero',
  'ocl-icd',
  'zlib',
  'zstd',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"




