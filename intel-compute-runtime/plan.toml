name = "intel-compute-runtime"
version = "26.27.39122.11"
release = 1
description = "Intel(R) Graphics Compute Runtime for oneAPI Level Zero and OpenCL(TM) Driver"
license = "MIT"
arch = "x86_64"
url = "https://github.com/intel/compute-runtime"

link_deps = ['glibc', 'gcc:gcc-libs', 'gcc:libstdc++', 'intel-gmmlib', 'intel-graphics-compiler', 'level-zero']
build_deps = ['cmake', 'ninja', 'level-zero']

[[sources]]
type = "http"
url = "https://github.com/intel/compute-runtime/archive/${VERSION}/intel-compute-runtime-${VERSION}.tar.gz"
sha256 = "914f5626d0067881f0a390d9f05a165230f47e36126728e3d6f4ce2b7fef946c"
extract_to = "source"

[[sources]]
type = "http"
url = "https://github.com/oneapi-src/level-zero/archive/refs/tags/v1.32.0.tar.gz"
sha256 = "b658d3be89b2ea3c5e6b3214592acb58a4875e738184b1a4cc7e9cf878b5f7b9"

[options]
ccache = true

[pipeline.prepare]
script = '''
# Wire in-tree Level Zero headers next to compute-runtime source
mv ${WORKDIR}/level-zero-1.32.0 ${WORKDIR}/source/level_zero
'''

[pipeline.configure]
script = '''
# Avoid runtime failures in applications such as Blender.
export CFLAGS="${CFLAGS} -DSANITIZER_BUILD=1"
export CXXFLAGS="${CXXFLAGS} -DSANITIZER_BUILD=1"

# Remove the inherited _FORTIFY_SOURCE definition to avoid redefinition warnings.
export CFLAGS="${CFLAGS/-Wp,-D_FORTIFY_SOURCE=?/}"
export CXXFLAGS="${CXXFLAGS/-Wp,-D_FORTIFY_SOURCE=?/}"

# Use the OpenCL headers bundled in the source tree.
_opencl_headers_dir="${WORKDIR}/source/compute-runtime-${VERSION}/third_party/opencl_headers"
export CXXFLAGS="${CXXFLAGS} -isystem ${_opencl_headers_dir}"

# Split the release version into the components expected by CMake.
MAJOR="${VERSION%%.*}"
MINOR="$(echo $VERSION | cut -d . -f2)"
BUILD="$(echo $VERSION | cut -d . -f3)"

cmake -B build -S "${WORKDIR}/source/compute-runtime-${VERSION}" \
    -GNinja \
    -DCMAKE_BUILD_TYPE='Release' \
    -DCMAKE_INSTALL_LIBDIR='lib' \
    -DCMAKE_INSTALL_PREFIX='/usr' \
    -DLEVEL_ZERO_ROOT="${WORKDIR}/source/level_zero" \
    -DNEO_BUILD_UNVERSIONED_OCLOC='ON' \
    -DNEO_DISABLE_LD_GOLD:BOOL='ON' \
    -DNEO_DISABLE_WERROR:BOOL='ON' \
    -DNEO_OCL_VERSION_MAJOR="$MAJOR" \
    -DNEO_OCL_VERSION_MINOR="$MINOR" \
    -DNEO_VERSION_BUILD="$BUILD" \
    -DKHRONOS_GL_HEADERS_DIR='/usr/include' \
    -DKHRONOS_HEADERS_DIR="$_opencl_headers_dir" \
    -Wno-dev
'''

[pipeline.compile]
script = "cmake --build build -j$(nproc)"

[pipeline.staging]
script = '''
DESTDIR=${STAGING_DIR} cmake --install build
install -D -m644 "${WORKDIR}/source/compute-runtime-${VERSION}/LICENSE.md" \
    -t "${STAGING_DIR}/usr/share/licenses/${NAME}"

# Add the unversioned Level Zero driver symlink when needed.
cd ${STAGING_DIR}/usr/lib
target_so=$(find . -regex '.*libze_intel_gpu.so.[0-9]*' -exec basename {} \;)
if [ -n "$target_so" ]; then
    ln -s "$target_so" "libze_intel_gpu.so"
fi
'''

[[output]]
runtime_deps = ['glibc', 'intel-gmmlib', 'intel-graphics-compiler', 'gcc:gcc-libs', 'gcc:libstdc++', 'level-zero']
provides = ['level-zero-driver', 'opencl-driver']

