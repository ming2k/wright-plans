name = "unifdef"
version = "2.12"
release = 1
description = "Tool for selectively removing ifdef from C/C++ sources"
license = "BSD-2-Clause"
arch = "x86_64"


[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://dotat.at/prog/unifdef/unifdef-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.prepare]
script = '''
cd source/unifdef-${VERSION}
# GCC 15 treats 'constexpr' as a C23 keyword; rename the legacy variable.
sed -i 's/constexpr/const_expr/g' unifdef.c'''

[pipeline.compile]
script = '''
cd source/unifdef-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/unifdef-${VERSION}
# Install under the staged /usr prefix.
make prefix=${STAGING_DIR}/usr install'''
