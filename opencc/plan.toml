name = "opencc"
version = "1.4.2"
release = 1
description = "Open Chinese Convert — Simplified/Traditional Chinese conversion"
license = "Apache-2.0"
arch = "x86_64"
url = "https://github.com/BYVoid/OpenCC"

link_deps = ['marisa']
build_deps = ['ninja', 'cmake']

[[sources]]
type = "http"
sha256 = "8e5f5cf7fe195bd9b9be851adc9738c1ef7dc5c24441dd5878a56db4087a9a70"
url = "https://github.com/BYVoid/OpenCC/archive/refs/tags/ver.${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cmake -B ${WORKDIR}/build -S ${WORKDIR}/source/OpenCC-ver.${VERSION} -G Ninja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_BUILD_TYPE=Release \
    -DBUILD_PYTHON=OFF \
    -DBUILD_TESTING=OFF \
    -DBUILD_DOCUMENTATION=OFF'''

[pipeline.compile]
script = '''
ninja -C ${WORKDIR}/build -j$(nproc)'''

[pipeline.staging]
script = '''
DESTDIR=${STAGING_DIR} ninja -C ${WORKDIR}/build install'''

[[output]]
runtime_deps = ['marisa']
