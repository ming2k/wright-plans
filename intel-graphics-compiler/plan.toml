name = "intel-graphics-compiler"
version = "2.38.2"
release = 1
epoch = 1
description = "Intel Graphics Compiler for OpenCL"
license = "MIT, Apache-2.0 WITH LLVM-exception"
arch = "x86_64"
url = "https://github.com/intel/intel-graphics-compiler"

link_deps = ['glibc', 'gcc:gcc-libs', 'gcc:libstdc++', 'zlib', 'zstd']
build_deps = ['cmake', 'ninja']

[[sources]]
type = "http"
url = "https://github.com/intel/intel-graphics-compiler/archive/v${VERSION}/intel-graphics-compiler-${VERSION}.tar.gz"
sha256 = "24f707f08d9b87e7e6857f8a83d9944990189c051ce9b3c91c291bdc1563246f"
extract_to = "source"

[[sources]]
type = "http"
url = "https://github.com/intel/vc-intrinsics/archive/refs/tags/v0.25.0.tar.gz"
sha256 = "83d6e0528feb6a47f7818e7c1dd3305dd8a48fb1103d279571dad517a93a8d39"

[[sources]]
type = "http"
url = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/6798e15796e21339af79e248c067cfb746c60d0c.tar.gz"
sha256 = "497674fa7322c1eec68ef164401767c72378d27e26a74cac3f88ba39fd408500"

[[sources]]
type = "http"
url = "https://github.com/KhronosGroup/SPIRV-Tools/archive/28a883ba4c67f58a9540fb0651c647bb02883622.tar.gz"
sha256 = "27c81a2f90dffdb18026bb62f455284c364ab25431df117816d55b9d944f880b"

[[sources]]
type = "http"
url = "https://github.com/KhronosGroup/SPIRV-Headers/archive/b8a32968473ce852a809b9de5f04f02a5a9dfa78.tar.gz"
sha256 = "ac53436ab612fbc6e294c775a5031f5a6710ec10bb536dea333fb10c30ea24c3"

[[sources]]
type = "http"
url = "https://github.com/intel/opencl-clang/archive/059ad9df664d9cdf54632e12b0011130dcadb46d.tar.gz"
sha256 = "0e424eac26093fff421242a6ca7c55b5222742e0a645513915aaa6a044df7c98"

[[sources]]
type = "http"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/llvm-project-17.0.6.src.tar.xz"
sha256 = "58a8818c60e6627064f312dbf46c02d9949956558340938b71cf731ad8bc0813"

[[sources]]
type = "local"
path = "patches/010-intel-graphics-compiler-disable-werror.patch"

[options]
ccache = true
# IGC's internal LLVM patching script requires a Git identity.
env = { GIT_COMMITTER_NAME = "builduser", GIT_COMMITTER_EMAIL = "builduser@archlinux.org", GIT_AUTHOR_NAME = "builduser", GIT_AUTHOR_EMAIL = "builduser@archlinux.org" }

[pipeline.prepare]
script = '''
# Normalize extracted HTTP source directory names to match expected layout.
mv ${WORKDIR}/vc-intrinsics-0.25.0 ${WORKDIR}/vc-intrinsics
mv ${WORKDIR}/SPIRV-LLVM-Translator-* ${WORKDIR}/SPIRV-LLVM-Translator-IGC-LLVM
mv ${WORKDIR}/SPIRV-Tools-* ${WORKDIR}/SPIRV-Tools
mv ${WORKDIR}/SPIRV-Headers-* ${WORKDIR}/SPIRV-Headers
mv ${WORKDIR}/opencl-clang-* ${WORKDIR}/opencl-clang
mv ${WORKDIR}/llvm-project-17.0.6.src ${WORKDIR}/llvm-project

# Wire component symlinks into ${WORKDIR}/source where IGC CMake resolves them relative to IGC source dir.
mkdir -p ${WORKDIR}/source
ln -sf ${WORKDIR}/vc-intrinsics ${WORKDIR}/source/vc-intrinsics
ln -sf ${WORKDIR}/SPIRV-Tools ${WORKDIR}/source/SPIRV-Tools
ln -sf ${WORKDIR}/SPIRV-Headers ${WORKDIR}/source/SPIRV-Headers
ln -sf ${WORKDIR}/SPIRV-LLVM-Translator-IGC-LLVM ${WORKDIR}/source/SPIRV-LLVM-Translator-IGC-LLVM
ln -sf ${WORKDIR}/opencl-clang ${WORKDIR}/source/opencl-clang
ln -sf ${WORKDIR}/llvm-project ${WORKDIR}/source/llvm-project

# Wire the LLVM components using the same layout as Arch's prepare step.
mkdir -p ${WORKDIR}/llvm-project/llvm/projects
ln -sf ${WORKDIR}/SPIRV-LLVM-Translator-IGC-LLVM ${WORKDIR}/llvm-project/llvm/projects/llvm-spirv
ln -sf ${WORKDIR}/opencl-clang ${WORKDIR}/llvm-project/llvm/projects/opencl-clang

# Apply the patch that disables warnings as errors.
patch -d "${WORKDIR}/source/intel-graphics-compiler-${VERSION}" -Np1 \
    -i ${WORKDIR}/010-intel-graphics-compiler-disable-werror.patch

# Fix GCC 15/16 missing <cstdint> header inclusion in LLVM X86MCTargetDesc.h
sed -i '1i #include <cstdint>' ${WORKDIR}/llvm-project/llvm/lib/Target/X86/MCTargetDesc/X86MCTargetDesc.h

# Fix IGC CMakeLists.txt bug where uninitialized IGC_OPTION__SPIRV_TRANSLATOR_SOURCE_DIR expands to /include
sed -i 's|${IGC_OPTION__SPIRV_TRANSLATOR_SOURCE_DIR}|'"${WORKDIR}"'/SPIRV-LLVM-Translator-IGC-LLVM|g' \
    "${WORKDIR}/source/intel-graphics-compiler-${VERSION}/IGC/CMakeLists.txt"
'''

[pipeline.configure]
isolation = "relaxed"
script = '''
# Restrict symbol visibility to prevent collisions between IGC components.
export CFLAGS="${CFLAGS} -fno-semantic-interposition"
export CXXFLAGS="${CXXFLAGS} -fno-semantic-interposition -include cstdint"
export LDFLAGS="${LDFLAGS} -Wl,-Bsymbolic"

# Remove the inherited _FORTIFY_SOURCE definition to avoid redefinition warnings.
export CFLAGS="${CFLAGS/-Wp,-D_FORTIFY_SOURCE=?/}"
export CXXFLAGS="${CXXFLAGS/-Wp,-D_FORTIFY_SOURCE=?/}"

# Point -S at the extracted tree so CMake can resolve ../llvm-project.
cmake -B build -S "${WORKDIR}/source/intel-graphics-compiler-${VERSION}" \
    -GNinja \
    -DCCLANG_FROM_SYSTEM=OFF \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5.0 \
    -DCMAKE_SKIP_RPATH=YES \
    -DIGC_OPTION__CLANG_MODE=Source \
    -DIGC_OPTION__LINK_KHRONOS_SPIRV_TRANSLATOR=ON \
    -DIGC_OPTION__SPIRV_TRANSLATOR_SOURCE_DIR="${WORKDIR}/llvm-project/llvm/projects/llvm-spirv" \
    -DIGC_OPTION__LLD_MODE=Source \
    -DIGC_OPTION__LLVM_MODE=Source \
    -DIGC_OPTION__LLVM_PREFERRED_VERSION="17.0.6" \
    -DIGC_OPTION__LLVM_SOURCES_DIR="${WORKDIR}/llvm-project" \
    -DLLVM_TARGETS_TO_BUILD="X86" \
    -DLLVM_ENABLE_PROJECTS="clang" \
    -DLLVM_ENABLE_ASSERTIONS=OFF \
    -DLLVM_ENABLE_OCAMLDOC=OFF \
    -DLLVM_ENABLE_BINDINGS=OFF \
    -DLLVM_ENABLE_LIBEDIT=OFF \
    -DLLVM_ENABLE_LIBXML2=OFF \
    -DLLVM_ENABLE_TERMINFO=OFF \
    -DLLVM_INCLUDE_TESTS=OFF \
    -DLLVM_INCLUDE_EXAMPLES=OFF \
    -DIGC_OPTION__SPIRV_TOOLS_MODE=Source \
    -DIGC_OPTION__USE_PREINSTALLED_SPIRV_HEADERS=OFF \
    -DIGC_OPTION__VC_INTRINSICS_MODE=Source \
    -Wno-dev
'''

[pipeline.compile]
script = "cmake --build build -j$(nproc)"

[pipeline.staging]
script = '''
DESTDIR=${STAGING_DIR} cmake --install build
install -D -m644 "${WORKDIR}/source/intel-graphics-compiler-${VERSION}/LICENSE.md" \
    -t "${STAGING_DIR}/usr/share/licenses/${NAME}"

# Move OpenCL headers into the IGC-specific include directory.
mkdir -p ${STAGING_DIR}/usr/include/igc
mv ${STAGING_DIR}/usr/include/opencl-c.h ${STAGING_DIR}/usr/include/igc/
mv ${STAGING_DIR}/usr/include/opencl-c-base.h ${STAGING_DIR}/usr/include/igc/

# Move versioned igc*/NOTICES.txt files into the package license directory.
mv ${STAGING_DIR}/usr/lib/igc*/NOTICES.txt ${STAGING_DIR}/usr/share/licenses/${NAME}/ || true

# Install opencl-clang compatibility headers and license metadata.
install -D -m644 ${WORKDIR}/opencl-clang/opencl_clang.h \
    -t "${STAGING_DIR}/usr/include/cclang"
install -D -m644 ${WORKDIR}/opencl-clang/LICENSE \
    "${STAGING_DIR}/usr/share/licenses/${NAME}/LICENSE-opencl-clang"
ln -sf libopencl-clang.so.17 "${STAGING_DIR}/usr/lib/libopencl-clang.so"
'''

[[output]]
runtime_deps = ['glibc', 'gcc:gcc-libs', 'gcc:libstdc++', 'zlib', 'zstd']
conflicts = ["intel-opencl-clang"]
replaces = ["intel-opencl-clang"]
