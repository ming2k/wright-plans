name = "opencl-clhpp"
version = "2026.05.29"
release = 1
description = "Khronos OpenCL C++ bindings"
license = "Apache-2.0"
arch = "any"
url = "https://github.com/KhronosGroup/OpenCL-CLHPP"

build_deps = ['cmake', 'ninja', 'opencl-headers']

[[sources]]
type = "http"
url = "https://github.com/KhronosGroup/OpenCL-CLHPP/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "fafb4fd202d113992c009d46e6358e70076167e62a5baeb377fe813033a2655e"
extract_to = "source"

[pipeline.configure]
script = '''
cmake -B build -S "${WORKDIR}/source/OpenCL-CLHPP-${VERSION}" \
    -GNinja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DOPENCL_CLHPP_HEADERS_DIR=OFF \
    -DOPENCL_DIST_DIR=OFF \
    -DBUILD_DOCS=OFF \
    -DBUILD_EXAMPLES=OFF \
    -DBUILD_TESTING=OFF
'''

[pipeline.staging]
script = '''
DESTDIR=${STAGING_DIR} cmake --install build
install -D -m644 "${WORKDIR}/source/OpenCL-CLHPP-${VERSION}/LICENSE.txt" \
    -t "${STAGING_DIR}/usr/share/licenses/${NAME}"
'''

[[output]]
runtime_deps = ['opencl-headers']

