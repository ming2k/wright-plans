name = "harfbuzz"
version = "14.5.0"
release = 1
description = "OpenType text shaping engine"
license = "MIT"
arch = "x86_64"
url = "https://github.com/harfbuzz/harfbuzz"

link_deps = ['cairo', 'freetype', 'glib', 'icu', 'graphite2']
build_deps = ['meson', 'ninja', 'pkgconf']

[[sources]]
type = "http"
sha256 = "b7132e148358a45185c9feafd049dbaf243649d3c44414b3534d9c95d18592b9"
url = "https://github.com/harfbuzz/harfbuzz/releases/download/${VERSION}/harfbuzz-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/harfbuzz-${VERSION}
meson setup build \
    --prefix=/usr          \
    --buildtype=release    \
    --wrap-mode=nofallback \
    -D cairo=enabled       \
    -D icu=enabled         \
    -D glib=enabled        \
    -D gobject=enabled     \
    -D graphite2=enabled   \
    -D tests=disabled      \
    -D docs=disabled'''

[pipeline.compile]
script = '''
cd source/harfbuzz-${VERSION}/build
ninja -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/harfbuzz-${VERSION}/build
DESTDIR=${STAGING_DIR} ninja install'''

[[output]]
runtime_deps = ['cairo', 'freetype', 'glib', 'icu', 'graphite2']
