name = "gst-plugins-good"
version = "1.28.2"
release = 1
description = "GStreamer Good Plugins"
license = "LGPL-2.0-or-later"
arch = "x86_64"

link_deps = ['libsoup']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "1ace2d8ec74f632d82eab5006753a27fe0c2402db4ca94d63271e494b62f50bf"
url = "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/gst-plugins-good-${VERSION}
export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
meson setup build --prefix=/usr --libdir=lib -Dtests=disabled -Ddoc=disabled'''

[pipeline.compile]
script = '''
cd source/gst-plugins-good-${VERSION}/build
ninja -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/gst-plugins-good-${VERSION}/build
DESTDIR=${STAGING_DIR} ninja install'''

[[output]]
runtime_deps = ['cairo', 'gdk-pixbuf', 'gst-plugins-base', 'gstreamer', 'libsoup']
