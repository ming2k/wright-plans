name = "zellij"
version = "0.45.1"
release = 1
description = "A terminal workspace with batteries included"
license = "MIT"
arch = "x86_64"
url = "https://github.com/zellij-org/zellij"


build_deps = ['rust-bin']

[[sources]]
type = "http"
sha256 = "5cbe711437d2a61afd9287165f6aca0bcccb9ab1473633665a5b11ed55467852"
url = "https://github.com/zellij-org/zellij/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_TARGET_DIR = '${WORKDIR}/target' }
script = '''
cd source/zellij-${VERSION}
cargo build --release --locked'''

[pipeline.staging]
script = '''
cd source/zellij-${VERSION}
install -Dm755 target/release/zellij ${STAGING_DIR}/usr/bin/zellij'''
