name = "lcms2"
version = "2.19.1"
release = 1
description = "Small-footprint color management engine"
license = "MIT"
arch = "x86_64"
url = "https://github.com/mm2/Little-CMS"

link_deps = ['libjpeg-turbo']

[[sources]]
type = "http"
sha256 = "bfc54f7bab59fbc921012014a8032e4cba4abd46db47d46b76416a8c0b2815c8"
url = "https://github.com/mm2/Little-CMS/releases/download/lcms${VERSION}/lcms2-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/lcms2-${VERSION}
./configure --prefix=/usr --disable-static'''

[pipeline.compile]
script = '''
cd source/lcms2-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/lcms2-${VERSION}
make DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['libjpeg-turbo']
