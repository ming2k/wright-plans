name = "aom"
version = "3.13.1"
release = 1
description = "Alliance for Open Media AV1 Codec SDK"
license = "BSD-2-Clause"
arch = "x86_64"


build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://storage.googleapis.com/aom-releases/libaom-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.prepare]
script = '''
cd source/libaom-${VERSION}

# GCC 15 requires <cstdint> for uint32_t and uint64_t in the bundled libwebm.
sed -i '/#include <cassert>/a #include <cstdint>' third_party/libwebm/mkvparser/mkvparser.cc

# Raise the minimum CMake version to silence compatibility warnings under CMake 4.x.
find . -name "*.cmake" -exec sed -i 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.10)/' {} +'''

[pipeline.configure]
script = '''
mkdir -p source/libaom-${VERSION}/build
cd source/libaom-${VERSION}/build

cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DENABLE_NASM=ON -DENABLE_TESTS=OFF -DENABLE_DOCS=OFF'''

[pipeline.compile]
script = '''
cd source/libaom-${VERSION}/build
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libaom-${VERSION}/build
make DESTDIR=${STAGING_DIR} install'''
