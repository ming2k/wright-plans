name = "libfyaml"
version = "0.9.6"
release = 2
description = "Fully feature complete YAML parser and emitter"
license = "MIT"
arch = "x86_64"
url = "https://github.com/pantoniou/libfyaml"

link_deps = ['glibc']
build_deps = ['cmake', 'ninja']

[[sources]]
type = "http"
sha256 = "2d016379a69f6cf6beaf06d12bcefe1ad1784bab28fbb41a6fa8d49d25f1bc0a"
url = "https://github.com/pantoniou/libfyaml/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libfyaml-${VERSION}
cmake -S . -B build \
    -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_SHARED_LIBS=ON \
    -DBUILD_TESTING=OFF \
    -DENABLE_NETWORK=OFF \
    -DENABLE_ASAN=OFF \
    -DSPHINX_EXECUTABLE=""'''

[pipeline.compile]
script = '''
cd source/libfyaml-${VERSION}
cmake --build build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libfyaml-${VERSION}
DESTDIR=${STAGING_DIR} cmake --install build
chmod -R a+rX ${STAGING_DIR}'''

