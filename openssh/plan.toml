name = "openssh"
version = "10.3p1"
release = 8
description = "Free implementation of the SSH protocol suite"
license = "BSD-2-Clause"
arch = "x86_64"
url = "https://www.openssh.com/portable.html"

link_deps = ['glibc', 'libedit', 'linux-pam', 'openssl', 'zlib', 'libxcrypt']
build_deps = ['autoconf', 'automake']

[[sources]]
type = "git"
url = "https://github.com/openssh/openssh-portable.git"
ref = "V_10_3_P1"
extract_to = "source"

[pipeline.configure]
script = '''
cd source
autoreconf -fi
./configure \
  --prefix=/usr \
  --sysconfdir=/etc/ssh \
  --libexecdir=/usr/lib/ssh \
  --sbindir=/usr/bin \
  --with-privsep-path=/usr/share/empty.sshd \
  --with-privsep-user=nobody \
  --with-pam \
  --with-libedit \
  --with-ssl-engine \
  --disable-lastlog \
  --with-default-path=/usr/bin
'''

[pipeline.compile]
script = '''
cd source
make -j$(nproc)
'''

[pipeline.staging]
script = '''
cd source
make DESTDIR=${STAGING_DIR} install

# ── Systemd service units ───────────────────────────────────────────────────
install -dm755 "${STAGING_DIR}/usr/lib/systemd/system"
cat << 'EOF' > "${STAGING_DIR}/usr/lib/systemd/system/sshd.service"
[Unit]
Description=OpenSSH Daemon
Documentation=man:sshd(8) man:sshd_config(5)
After=network.target

[Service]
Type=notify
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStart=/usr/bin/sshd -D
KillMode=process
Restart=on-failure
RestartSec=2s

[Install]
WantedBy=multi-user.target
EOF

# ── Systemd user units (ssh-agent) ──────────────────────────────────────────
install -dm755 "${STAGING_DIR}/usr/lib/systemd/user"
cat << 'EOF' > "${STAGING_DIR}/usr/lib/systemd/user/ssh-agent.service"
[Unit]
Description=OpenSSH Authentication Agent
Documentation=man:ssh-agent(1)
Requires=ssh-agent.socket

[Service]
ExecStart=/usr/bin/ssh-agent -D -a %t/ssh-agent.socket
PassEnvironment=SSH_AGENT_PID

[Install]
WantedBy=default.target
Also=ssh-agent.socket
EOF

cat << 'EOF' > "${STAGING_DIR}/usr/lib/systemd/user/ssh-agent.socket"
[Unit]
Description=OpenSSH Authentication Agent Socket

[Socket]
ListenStream=%t/ssh-agent.socket
SocketMode=0600
DirectoryMode=0700

[Install]
WantedBy=sockets.target
EOF

# ── tmpfiles (privilege separation chroot) ──────────────────────────────────
install -dm755 "${STAGING_DIR}/usr/lib/tmpfiles.d"
cat << 'EOF' > "${STAGING_DIR}/usr/lib/tmpfiles.d/openssh.conf"
# /usr/lib/tmpfiles.d/openssh.conf
# Privilege separation chroot directory
d /usr/share/empty.sshd 0755 root root -
EOF

# ── Factory defaults ────────────────────────────────────────────────────────
install -Dm644 ${STAGING_DIR}/etc/ssh/ssh_config     ${STAGING_DIR}/usr/share/factory/etc/ssh/ssh_config
install -Dm644 ${STAGING_DIR}/etc/ssh/sshd_config    ${STAGING_DIR}/usr/share/factory/etc/ssh/sshd_config

# ── PAM configuration ───────────────────────────────────────────────────────
install -dm755 "${STAGING_DIR}/etc/pam.d"
cat << 'EOF' > "${STAGING_DIR}/etc/pam.d/sshd"
# /etc/pam.d/sshd
auth      include   system-auth
account   required  pam_nologin.so
account   include   system-account
session   required  pam_loginuid.so
session   include   system-session
password  include   system-password
EOF

# ── Permissions ─────────────────────────────────────────────────────────────
if [ -e ${STAGING_DIR}/usr/lib/ssh/ssh-keysign ]; then
  chmod 4755 ${STAGING_DIR}/usr/lib/ssh/ssh-keysign
fi
'''

[[output]]
runtime_deps = ['shadow', 'glibc', 'libedit', 'linux-pam', 'openssl', 'zlib', 'libxcrypt']
backup = ["/etc/ssh/ssh_config", "/etc/ssh/sshd_config", "/etc/pam.d/sshd"]

hooks.post_install = '''
systemd-tmpfiles --create /usr/lib/tmpfiles.d/openssh.conf 2>/dev/null || true
systemctl daemon-reload 2>/dev/null || true
'''
hooks.post_upgrade = '''
systemd-tmpfiles --create /usr/lib/tmpfiles.d/openssh.conf 2>/dev/null || true
systemctl daemon-reload 2>/dev/null || true
'''

