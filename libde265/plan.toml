name = "libde265"
version = "1.1.1"
release = 1
description = "Open H.265 video codec implementation"
license = "LGPL-3.0-or-later"
arch = "x86_64"
url = "https://github.com/strukturag/libde265"

build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "fd48a927e94ed74fc7ce8829d222b9d8599fcbfe8b6448ba66705babc56ab219"
url = "https://github.com/strukturag/libde265/releases/download/v${VERSION}/libde265-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/*
cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release'''

[pipeline.compile]
script = '''
cd source/*
cmake --build build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/*
DESTDIR=${STAGING_DIR} cmake --install build'''

[[output]]
runtime_deps = ['glibc']
