name = "sysstat"
version = "12.8.0"
release = 1
description = "System performance monitoring tools (sar, iostat, mpstat, pidstat)"
license = "GPL-2.0-only"
arch = "x86_64"
url = "https://github.com/sysstat/sysstat"


[[sources]]
type = "http"
sha256 = "8aa2054c56c941ab30e1b14ad2e0076a7e6d6bf01f50e22d954885b8a7f9a679"
url = "https://github.com/sysstat/sysstat/archive/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/sysstat-${VERSION}
sa_lib_dir=/usr/lib/sa \
sa_dir=/var/log/sa \
conf_dir=/etc/default \
./configure \
  --prefix=/usr \
  --bindir=/usr/bin \
  --sbindir=/usr/bin \
  --libdir=/usr/lib \
  --sysconfdir=/etc \
  --disable-file-attr \
  --enable-install-cron \
  --enable-copy-only'''

[pipeline.compile]
script = '''
cd source/sysstat-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/sysstat-${VERSION}
make DESTDIR=${STAGING_DIR} install

if [ -d ${STAGING_DIR}/usr/sbin ]; then
  cp -a ${STAGING_DIR}/usr/sbin/. ${STAGING_DIR}/usr/bin/
  rm -rf ${STAGING_DIR}/usr/sbin
fi'''

[[output]]
runtime_deps = ['systemd']
backup = ["/etc/default/sysstat"]

[output.hooks]
post_install = "systemctl enable --now sysstat 2>/dev/null || true"
post_upgrade = "systemctl try-restart sysstat 2>/dev/null || true"
pre_remove = "systemctl disable --now sysstat 2>/dev/null || true"
