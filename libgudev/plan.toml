name = "libgudev"
version = "238"
release = 1
description = "GObject bindings for libudev"
license = "LGPL-2.1-or-later"
arch = "x86_64"

link_deps = ['glib']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://download.gnome.org/sources/libgudev/${VERSION}/libgudev-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
# Configure from the extracted source tree.
cd source/libgudev-${VERSION}

# Use an explicit Meson build directory.
meson setup build --prefix=/usr --libdir=lib -Dtests=disabled -Dintrospection=enabled -Dvapi=disabled'''

[pipeline.compile]
script = '''
cd source/libgudev-${VERSION}/build
ninja -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libgudev-${VERSION}/build
DESTDIR=${STAGING_DIR} ninja install'''

[[output]]
runtime_deps = ['systemd', 'glib']
