name = "inotify-tools"
version = "4.26.262"
release = 1
description = "Command-line utilities for Linux inotify"
license = "GPL-2.0-or-later"
arch = "x86_64"
url = "https://github.com/inotify-tools/inotify-tools"

link_deps = ['glibc']
build_deps = ['autoconf', 'automake', 'libtool', 'doxygen']

[[sources]]
type = "http"
url = "https://github.com/inotify-tools/inotify-tools/archive/refs/tags/${VERSION}.tar.gz"
sha256 = "989895241148580c820872ecd4f2b06f3dd8c5d72f61c4852dbf936beb2b067f"
extract_to = "source"

[pipeline.prepare]
script = '''
cd source/inotify-tools-${VERSION}
autoreconf -fi'''

[pipeline.configure]
script = '''
cd source/inotify-tools-${VERSION}
./configure --prefix=/usr --disable-static --enable-doxygen=no'''

[pipeline.compile]
script = '''
cd source/inotify-tools-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/inotify-tools-${VERSION}
make DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['glibc']
