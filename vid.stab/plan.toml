name = "vid.stab"
version = "1.1.2"
release = 1
description = "Video stabilization library"
license = "GPL-2.0-or-later"
arch = "x86_64"


build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "96db34d48a9e3aa13736a48744b56dfb76731ac9bb5193c716de8534c9fd709d"
url = "https://github.com/georgmartius/vid.stab/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/vidstab-${VERSION}
cmake -B build \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_BUILD_TYPE=Release \
    -DBUILD_SHARED_LIBS=ON'''

[pipeline.compile]
script = '''
cd source/vidstab-${VERSION}
cmake --build build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/vidstab-${VERSION}
DESTDIR=${STAGING_DIR} cmake --install build'''
