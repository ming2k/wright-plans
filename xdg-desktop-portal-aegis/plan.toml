name = "xdg-desktop-portal-aegis"
version = "0.0.25"
release = 1
description = "XDG Desktop Portal backend for the Aegis compositor"
license = "MIT"
arch = "x86_64"
url = "https://github.com/aegis-shell/xdg-desktop-portal-aegis"

build_deps = ['rust-bin', 'meson', 'ninja', 'pkgconf', 'llvm:clang']
link_deps = [
    'optics:flux >= 0.0.27',
    'optics:lens >= 0.0.27',
    'optics:iris >= 0.0.27',
    'pipewire >= 0.3', 'linux-pam',
    'gcc:gcc-libs', 'glibc',
]

[[sources]]
type = "http"
url = "https://github.com/aegis-shell/xdg-desktop-portal-aegis/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "SKIP"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/xdg-desktop-portal-aegis-${VERSION}
# The canonical package build uses the locked Optics Git bindings and the
# native Wright outputs declared in link_deps. A local .cargo/config.toml
# must never be present in the release source.
test ! -e .cargo/config.toml
meson setup build \
    --prefix=/usr \
    --buildtype=release \
    -Dpam=true
'''

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_NET_GIT_FETCH_WITH_CLI = 'true' }
script = '''
cd source/xdg-desktop-portal-aegis-${VERSION}
meson compile -C build
'''

[pipeline.staging]
script = '''
cd source/xdg-desktop-portal-aegis-${VERSION}
DESTDIR="$STAGING_DIR" meson install -C build
install -Dm644 LICENSE \
    "$STAGING_DIR/usr/share/licenses/xdg-desktop-portal-aegis/LICENSE"
'''

[[output]]
runtime_deps = [
    'aegis >= 0.0.48',
    'optics:flux >= 0.0.27', 'optics:lens >= 0.0.27', 'optics:iris >= 0.0.27',
    'pipewire >= 0.3', 'wireplumber', 'linux-pam',
    'xdg-desktop-portal', 'xdg-utils',
    'gcc:gcc-libs', 'glibc',
]
