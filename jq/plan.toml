name = "jq"
version = "1.8.2"
release = 1
description = "Command-line JSON processor"
license = "MIT"
arch = "x86_64"
url = "https://jqlang.org/"


[[sources]]
type = "http"
sha256 = "71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af"
url = "https://github.com/jqlang/jq/releases/download/jq-${VERSION}/jq-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/jq-${VERSION}
./configure --prefix=/usr --disable-static --with-oniguruma=builtin'''

[pipeline.compile]
script = '''
cd source/jq-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/jq-${VERSION}
make DESTDIR=${STAGING_DIR} install'''
