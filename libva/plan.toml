name = "libva"
version = "2.24.1"
release = 1
description = "Video Acceleration (VA) API for Linux"
license = "MIT"
arch = "x86_64"
url = "https://github.com/intel/libva"

link_deps = ['libdrm', 'mesa', 'wayland']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "0b4a3649ee8d683b9cce2ef094df4fb039d276c0cef7e49337c43d3b297b9f42"
url = "https://github.com/intel/libva/archive/refs/tags/${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libva-${VERSION}
meson setup build \
--prefix=/usr \
--buildtype=release \
-D with_x11=no \
-D with_glx=no \
-D with_wayland=yes \
-D with_win32=no'''

[pipeline.compile]
script = '''
cd source/libva-${VERSION}
ninja -C build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libva-${VERSION}
DESTDIR=${STAGING_DIR} ninja -C build install'''

[[output]]
runtime_deps = ['libdrm', 'mesa', 'wayland']
