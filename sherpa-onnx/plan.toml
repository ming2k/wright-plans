name = "sherpa-onnx"
version = "1.13.5"
release = 2
description = "Speech-to-text, text-to-speech, speaker diarization, and VAD using next-gen Kaldi with onnxruntime"
license = "Apache-2.0"
arch = "x86_64"
url = "https://github.com/k2-fsa/sherpa-onnx"

link_deps = ['onnxruntime']
build_deps = ['ninja', 'cmake']

[[sources]]
type = "http"
sha256 = "99f520db7364a06be0c174a385d03f9ccdbfe08f61146055229e4a990e285262"
url = "https://github.com/k2-fsa/sherpa-onnx/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[[sources]]
type = "local"
path = "patches/0001-fix-pkgconfig-install-destination.patch"

[pipeline.prepare]
script = '''
cd source/sherpa-onnx-${VERSION}
patch -Np1 < ${WORKDIR}/0001-fix-pkgconfig-install-destination.patch
'''

[pipeline.configure]
isolation = "relaxed"
script = '''
cd source/sherpa-onnx-${VERSION}
cmake -B build -G Ninja \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_PREFIX=/usr \
  -DBUILD_SHARED_LIBS=ON \
  -DSHERPA_ONNX_ENABLE_TESTS=OFF \
  -DSHERPA_ONNX_ENABLE_PYTHON=OFF \
  -DSHERPA_ONNX_ENABLE_JNI=OFF \
  -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
  -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
  -DSHERPA_ONNX_ENABLE_GPU=OFF \
  -DSHERPA_ONNX_ENABLE_C_API=ON \
  -DSHERPA_ONNX_ENABLE_TTS=ON \
  -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=ON \
  -DSHERPA_ONNX_ENABLE_BINARY=ON \
  -DSHERPA_ONNX_LINK_LIBSTDCPP_STATICALLY=OFF
'''

[pipeline.compile]
script = '''
cd source/sherpa-onnx-${VERSION}
ninja -C build -j$(nproc)
'''

[pipeline.staging]
script = '''
cd source/sherpa-onnx-${VERSION}
DESTDIR=${STAGING_DIR} ninja -C build install
'''

[[output]]
runtime_deps = ['onnxruntime']

