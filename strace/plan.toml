name = "strace"
version = "7.2"
release = 1
description = "Diagnostic, debugging and instructional userspace tracer"
license = "LGPL-2.1-or-later"
arch = "x86_64"
url = "https://strace.io"

link_deps = ['glibc']

[[sources]]
type = "http"
sha256 = "4bde6246926890dcee824f6e6ac42a06752f47d77e5097d86e3c0d6d4b709fe5"
url = "https://github.com/strace/strace/releases/download/v${VERSION}/strace-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/strace-${VERSION}
./configure --prefix=/usr \
    --with-libiberty'''

[pipeline.compile]
script = '''
cd source/strace-${VERSION}
make -j$(nproc) -C ${WORKDIR}'''

[pipeline.staging]
script = '''
cd source/strace-${VERSION}
make DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['glibc']
