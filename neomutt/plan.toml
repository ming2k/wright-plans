name = "neomutt"
version = "20260616"
release = 1
description = "Feature-rich command-line email client"
license = "GPL-2.0-only"
arch = "x86_64"
url = "https://neomutt.org/"

link_deps = ['cyrus-sasl', 'gdbm', 'gnutls', 'gpgme', 'krb5', 'libidn2', 'lua', 'ncurses', 'pcre2', 'sqlite']

[[sources]]
type = "http"
sha256 = "2c34fdd2166d5765e6bfdc21d1248bc4e92ddc0a33537b9418c17cd90e2dda80"
url = "https://github.com/neomutt/neomutt/archive/refs/tags/${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/neomutt-${VERSION}
./configure --prefix=/usr \
    --disable-doc \
    --with-lock=fcntl \
    --gnutls \
    --gpgme \
    --gss \
    --sasl \
    --lua \
    --pcre2 \
    --gdbm \
    --sqlite'''

[pipeline.compile]
script = '''
cd source/neomutt-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/neomutt-${VERSION}
make DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['ca-certificates', 'gnupg', 'cyrus-sasl', 'gdbm', 'gnutls', 'gpgme', 'krb5', 'libidn2', 'lua', 'ncurses', 'pcre2', 'sqlite']
