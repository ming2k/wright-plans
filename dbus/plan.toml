name = "dbus"
version = "1.16.2"
release = 5
description = "D-Bus protocol configuration, systemd socket definitions, and low-level client library"
license = "AFL-2.1 OR GPL-2.0-or-later"
arch = "x86_64"
url = "https://www.freedesktop.org/wiki/Software/dbus/"

link_deps = ['expat', 'systemd', 'glibc']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://dbus.freedesktop.org/releases/dbus/dbus-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/dbus-${VERSION}
mkdir -p build
cd build
meson setup --prefix=/usr \
    --sysconfdir=/etc \
    --localstatedir=/var \
    --buildtype=release \
    --wrap-mode=nofallback \
    -Dapparmor=disabled \
    -Dkqueue=disabled \
    -Dlaunchd=disabled \
    -Drelocation=disabled \
    -Dselinux=disabled \
    -Dsystemd=enabled \
    -Dx11_autolaunch=disabled \
    -Dtraditional_activation=false \
    -Ddoxygen_docs=disabled \
    -Druntime_dir=/run \
    -Dmodular_tests=disabled \
    ..'''

[pipeline.compile]
script = '''
cd source/dbus-${VERSION}/build
ninja'''

[pipeline.staging]
script = '''
cd source/dbus-${VERSION}/build
DESTDIR=${STAGING_DIR} ninja install

# Symlink so D-Bus and systemd share machine-id
ln -sfv /etc/machine-id ${STAGING_DIR}/var/lib/dbus'''

[[discard]]
include = [
    "/usr/bin/dbus-daemon",
    "/usr/bin/dbus-cleanup-sockets",
    "/usr/libexec/dbus-daemon-launch-helper",
    "/usr/lib/systemd/system/dbus.service",
    "/usr/lib/systemd/user/dbus.service",
    "/usr/lib/systemd/system/multi-user.target.wants/dbus.service",
]
reason = "Legacy dbus-daemon and setuid helper discarded in favor of modern dbus-broker"

# D-Bus outputs: libdbus library split out; rest stays in dbus catch-all
[[output]]
name = "libdbus"
description = "D-Bus low-level shared library"
runtime_deps = ['expat', 'glibc']
include = [
    "/usr/lib/libdbus-1.so*",
    "/usr/lib/libdbus-1.a",
    "/usr/lib/pkgconfig/dbus-1.pc",
    "/usr/include/dbus-1.0/**",
    "/usr/lib/dbus-1.0/**",
    "/usr/lib/cmake/dbus-1/**",
]

[[output]]
name = "dbus"
description = "D-Bus configuration assets, socket endpoints, and user tools"
runtime_deps = ['dbus:libdbus', 'systemd', 'glibc']
