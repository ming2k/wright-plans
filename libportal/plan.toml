name = "libportal"
version = "0.11.0"
release = 1
description = "GIO-style async APIs for Flatpak Portals"
license = "LGPL-3.0-or-later"
arch = "x86_64"
url = "https://github.com/flatpak/libportal"

link_deps = ['glib', 'gtk4']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "abb9e452a1c372133bd3eb8f0bb30d07b2d0a8fb02001c4155cf287555db4040"
url = "https://github.com/flatpak/libportal/releases/download/${VERSION}/libportal-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libportal-${VERSION}
meson setup build --prefix=/usr --buildtype=release -Dbackend-gtk3=disabled -Dbackend-gtk4=enabled -Dintrospection=true -Dvapi=false -Ddocs=false -Dtests=false'''

[pipeline.compile]
script = '''
cd source/libportal-${VERSION}
meson compile -C build'''

[pipeline.staging]
script = '''
cd source/libportal-${VERSION}
meson install -C build --destdir ${STAGING_DIR}'''

[[output]]
runtime_deps = ['glib', 'gtk4']
