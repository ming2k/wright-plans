name = "opencl-headers"
version = "2026.05.29"
release = 1
description = "OpenCL header files and API registry"
license = "Apache-2.0"
arch = "x86_64"
url = "https://github.com/KhronosGroup/OpenCL-Headers"

build_deps = ['cmake', 'ninja']

[[sources]]
type = "http"
url = "https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "d9e6c48357de5002da11ce45de600e0c3ffe6ab4f628a3b9fe2b38603161658a"
extract_to = "source"

[pipeline.configure]
script = '''
cmake -B build -S "${WORKDIR}/source/OpenCL-Headers-${VERSION}" \
    -GNinja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_BUILD_TYPE=Release \
    -DOPENCL_HEADERS_BUILD_TESTING=OFF
'''

[pipeline.staging]
script = '''
DESTDIR=${STAGING_DIR} cmake --install build
install -D -m644 "${WORKDIR}/source/OpenCL-Headers-${VERSION}/LICENSE" \
    -t "${STAGING_DIR}/usr/share/licenses/${NAME}"
'''

[[output]]
runtime_deps = []


