name = "eza"
version = "0.23.5"
release = 1
description = "A modern, maintained replacement for ls"
license = "MIT"
arch = "x86_64"
url = "https://github.com/eza-community/eza"


build_deps = ['rust-bin']

[[sources]]
type = "http"
sha256 = "SKIP"
url = "https://github.com/eza-community/eza/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_TARGET_DIR = '${WORKDIR}/target' }
script = '''
cd source/eza-${VERSION}
cargo build --release --locked'''

[pipeline.staging]
script = '''
cd source/eza-${VERSION}
install -Dm755 target/release/eza ${STAGING_DIR}/usr/bin/eza'''
