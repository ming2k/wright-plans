name = "gst-plugins-bad"
version = "1.28.2"
release = 1
description = "GStreamer Bad Plugins"
license = "LGPL-2.0-or-later"
arch = "x86_64"

link_deps = ['openssl']
build_deps = ['meson', 'ninja']

[[sources]]
type = "http"
sha256 = "6467e3964828f4d7d08bfe1fbb4d76287a1c8fa76674e59e101a149c020fefd7"
url = "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/gst-plugins-bad-${VERSION}
export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

# Disable SCTP for GCC 15 compatibility and introspection when GIR dependencies
# are unavailable; keep the required GPL plugins enabled.
meson setup build --prefix=/usr --libdir=lib -Dtests=disabled -Ddoc=disabled -Dgpl=enabled -Dsctp=disabled -Dintrospection=disabled'''

[pipeline.compile]
script = '''
cd source/gst-plugins-bad-${VERSION}/build
ninja -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/gst-plugins-bad-${VERSION}/build
DESTDIR=${STAGING_DIR} ninja install'''

[[output]]
runtime_deps = ['gst-plugins-base', 'gstreamer', 'openssl']
