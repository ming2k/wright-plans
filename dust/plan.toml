name = "dust"
version = "1.2.6"
release = 1
description = "A more intuitive version of du in rust"
license = "Apache-2.0"
arch = "x86_64"
url = "https://github.com/bootandy/dust"


build_deps = ['rust-bin']

[[sources]]
type = "http"
sha256 = "9dd1ec7576d43574e6f48342cb96a5087338b4c308460a848f5895f72ddc3bc9"
url = "https://github.com/bootandy/dust/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', CARGO_TARGET_DIR = '${WORKDIR}/target' }
script = '''
cd source/dust-${VERSION}
cargo build --release --locked'''

[pipeline.staging]
script = '''
cd source/dust-${VERSION}
install -Dm755 target/release/dust ${STAGING_DIR}/usr/bin/dust'''
