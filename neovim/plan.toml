name = "neovim"
version = "0.12.5"
release = 1
description = "Hyperextensible Vim-based text editor"
license = "Apache-2.0"
arch = "x86_64"
url = "https://neovim.io"
maintainer = "Neovim contributors <neovim@neovim.io>"

link_deps = ['glibc']

[[sources]]
type = "http"
sha256 = "a810c95332317bd0017e1ca07e376a8472c79075cbed00fa3737d190a8a0a45a"
url = "https://github.com/neovim/neovim/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[options]
ccache = true

[pipeline.configure]
isolation = "relaxed"
script = '''
cd source/neovim-${VERSION}
make CMAKE_BUILD_TYPE=Release CMAKE_INSTALL_PREFIX=/usr deps'''

[pipeline.compile]
script = '''
cd source/neovim-${VERSION}
make CMAKE_BUILD_TYPE=Release CMAKE_INSTALL_PREFIX=/usr'''

[pipeline.staging]
script = '''
cd source/neovim-${VERSION}
make CMAKE_INSTALL_PREFIX=/usr DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['glibc']

[output.hooks]
post_install = '''
update-desktop-database -q 2>/dev/null || true

'''
post_upgrade = '''
update-desktop-database -q 2>/dev/null || true

'''
