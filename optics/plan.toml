name = "optics"
version = "0.0.52"
release = 1
description = "Optics rendering libraries: flux, glyph, vista, prism, lens, iris, and transit"
license = "MIT"
arch = "x86_64"
url = "https://github.com/ming2k/optics"

build_deps = [
    'meson', 'ninja', 'glslang', 'pkgconf',
    'vulkan-headers', 'wayland-protocols',
]
link_deps = [
    'vulkan-loader', 'wayland', 'libxkbcommon', 'systemd',
    'fontconfig', 'harfbuzz', 'freetype', 'fribidi', 'glibc',
]

[[sources]]
type = "http"
url = "https://github.com/ming2k/optics/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "SKIP"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/optics-${VERSION}
meson setup build --prefix=/usr --buildtype=release \
    -Dcanvas=true \
    -Dscene=true \
    -Dcompute=true \
    -Deffect=true \
    -Dglyph=true \
    -Dvista=true \
    -Dprism=true \
    -Dtransit=true \
    -Dexamples=false \
    -Dtests=false
'''

[pipeline.compile]
script = '''
cd source/optics-${VERSION}
meson compile -C build
'''

[pipeline.staging]
script = '''
cd source/optics-${VERSION}
DESTDIR="$STAGING_DIR" meson install -C build
'''

[[output]]
name = "flux"
description = "libflux Vulkan-first graphics library"
include = [
    "/usr/include/flux/**",
    "/usr/lib/libflux.so",
    "/usr/lib/libflux.so.*",
    "/usr/lib/pkgconfig/flux.pc",
]
runtime_deps = ['glibc', 'vulkan-loader']
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "glyph"
description = "libglyph HarfBuzz shaping and dynamic glyph atlas runtime over flux"
include = [
    "/usr/include/glyph/**",
    "/usr/lib/libglyph.so",
    "/usr/lib/libglyph.so.*",
    "/usr/lib/pkgconfig/glyph.pc",
]
runtime_deps = [
    'optics:flux = ${VERSION}',
    'freetype', 'harfbuzz', 'fontconfig', 'fribidi', 'glibc',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "vista"
description = "libvista glTF 2.0 3D scene hierarchy and asset runtime over flux"
include = [
    "/usr/include/vista/**",
    "/usr/lib/libvista.so",
    "/usr/lib/libvista.so.*",
    "/usr/lib/pkgconfig/vista.pc",
]
runtime_deps = ['optics:flux = ${VERSION}', 'glibc']
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "prism"
description = "libprism material library (liquid glass) over the flux effect runtime"
include = [
    "/usr/include/prism/**",
    "/usr/lib/libprism.so",
    "/usr/lib/libprism.so.*",
    "/usr/lib/pkgconfig/prism.pc",
]
runtime_deps = ['optics:flux = ${VERSION}', 'glibc']
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "lens"
description = "liblens immediate-mode UI over a retained core"
include = [
    "/usr/include/lens/**",
    "/usr/lib/liblens.so",
    "/usr/lib/liblens.so.*",
    "/usr/lib/pkgconfig/lens.pc",
]
runtime_deps = [
    'optics:flux = ${VERSION}',
    'optics:glyph = ${VERSION}',
    'glibc',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "iris"
description = "libiris windowing/UI layer over lens"
include = [
    "/usr/include/iris/**",
    "/usr/lib/libiris.so",
    "/usr/lib/libiris.so.*",
    "/usr/lib/pkgconfig/iris.pc",
]
runtime_deps = [
    'optics:lens = ${VERSION}',
    'systemd', 'wayland', 'libxkbcommon', 'vulkan-loader', 'glibc',
]
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

[[output]]
name = "transit"
description = "libtransit shared motion vocabulary library (springs, easing, hysteresis, adaptive smoothing)"
include = [
    "/usr/include/transit/**",
    "/usr/lib/libtransit.so",
    "/usr/lib/libtransit.so.*",
    "/usr/lib/pkgconfig/transit.pc",
]
runtime_deps = ['glibc']
hooks.post_install = "ldconfig 2>/dev/null || true"
hooks.post_upgrade = "ldconfig 2>/dev/null || true"
hooks.post_remove = "ldconfig 2>/dev/null || true"

# This plan intentionally has no catch-all "optics" output. Consumers depend
# on the concrete outputs they link: optics:flux, optics:glyph,
# optics:vista, optics:prism, optics:lens, optics:iris, and optics:transit.
