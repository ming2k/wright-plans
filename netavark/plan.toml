name = "netavark"
version = "2.1.0"
release = 1
description = "OCI container network stack"
license = "Apache-2.0 AND BSD-3-Clause AND MIT"
arch = "x86_64"
url = "https://github.com/containers/netavark"

link_deps = ['glibc']

[[sources]]
type = "http"
sha256 = "96677048168ddd1abe313e4c2e17f1cace72b60ee1bac8ca12a4bd7dfcadfbbb"
url = "https://github.com/containers/netavark/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[[sources]]
type = "http"
sha256 = "532779573b7f4c2606e43f8471132bb9072417feed9ee06a4e309cf3fa066ab8"
url = "https://github.com/containers/netavark/releases/download/v${VERSION}/netavark-v${VERSION}-vendor.tar.gz"

[pipeline.prepare]
isolation = "none"
script = '''
cd source/netavark-${VERSION}
ln -sfn ../vendor vendor
install -dm755 .cargo
cat > .cargo/config.toml << 'EOF'
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
EOF'''

[pipeline.compile]
isolation = "none"
script = '''
cd source/netavark-${VERSION}
export CARGO_HOME=${WORKDIR}/.cargo-home
export CARGO_TARGET_DIR=${WORKDIR}/target

# Use upstream Makefile to build binaries and generate systemd units.
# We pass CARGO args to ensure strict offline building.
make PREFIX=/usr CARGO="cargo --locked --offline" \
    build \
    contrib/systemd/system/netavark-dhcp-proxy.service \
    contrib/systemd/system/netavark-firewalld-reload.service \
    contrib/systemd/system/netavark-nftables-reload.service'''

[pipeline.staging]
isolation = "none"
script = '''
cd source/netavark-${VERSION}

# Upstream's `make install` strictly depends on building documentation via `go-md2man`.
# Since `go-md2man` is not available in our build environment, we manually stage the
# binaries and generated systemd units instead of patching the Makefile.
install -Dm755 bin/netavark ${STAGING_DIR}/usr/libexec/podman/netavark
install -Dm755 bin/netavark-dhcp-proxy-client ${STAGING_DIR}/usr/libexec/podman/netavark-dhcp-proxy-client
install -Dm755 bin/netavark-connection-tester ${STAGING_DIR}/usr/libexec/podman/netavark-connection-tester

install -Dm644 contrib/systemd/system/netavark-dhcp-proxy.socket ${STAGING_DIR}/usr/lib/systemd/system/netavark-dhcp-proxy.socket
install -Dm644 contrib/systemd/system/netavark-dhcp-proxy.service ${STAGING_DIR}/usr/lib/systemd/system/netavark-dhcp-proxy.service
install -Dm644 contrib/systemd/system/netavark-firewalld-reload.service ${STAGING_DIR}/usr/lib/systemd/system/netavark-firewalld-reload.service
install -Dm644 contrib/systemd/system/netavark-nftables-reload.service ${STAGING_DIR}/usr/lib/systemd/system/netavark-nftables-reload.service

install -Dm644 /dev/null ${STAGING_DIR}/etc/containers/netavark.conf
cat > ${STAGING_DIR}/etc/containers/netavark.conf << 'EOF'
[default]
firewall_driver = "nftables"
EOF'''

[[output]]
runtime_deps = ['aardvark-dns', 'glibc', 'nftables']
backup = ["/etc/containers/netavark.conf"]

[output.hooks]
post_install = '''
systemctl daemon-reload 2>/dev/null || true
'''
post_upgrade = '''
systemctl daemon-reload 2>/dev/null || true
'''
