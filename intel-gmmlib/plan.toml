name = "intel-gmmlib"
version = "22.10.1"
release = 1
description = "Intel Graphics Memory Management Library"
license = "MIT"
arch = "x86_64"
url = "https://github.com/intel/gmmlib"

link_deps = ['glibc']
build_deps = ['cmake']

[[sources]]
type = "http"
sha256 = "33ebb6e65a2617c59f95a9e70ce0cbeca098316cd265345a0f4db5b381f1024c"
url = "https://github.com/intel/gmmlib/archive/intel-gmmlib-${VERSION}/intel-gmmlib-${VERSION}.tar.gz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/*
cmake -B build \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DBUILD_TESTING=OFF'''

[pipeline.compile]
script = '''
cd source/*
cmake --build build -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/*
DESTDIR=${STAGING_DIR} cmake --install build'''

[[output]]
runtime_deps = ['glibc']
