name = "libusb"
version = "1.0.30"
release = 1
description = "Library for userspace USB device access"
license = "LGPL-2.1-or-later"
arch = "x86_64"
url = "https://libusb.info"

link_deps = ['systemd']

[[sources]]
type = "http"
sha256 = "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf"
url = "https://github.com/libusb/libusb/releases/download/v${VERSION}/libusb-${VERSION}.tar.bz2"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/libusb-${VERSION}
./configure --prefix=/usr --disable-static'''

[pipeline.compile]
script = '''
cd source/libusb-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/libusb-${VERSION}
make DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['systemd']
