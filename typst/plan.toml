name = "typst"
version = "0.15.1"
release = 1
description = "A markup-based typesetting system that is powerful and easy to learn"
license = "Apache-2.0"
arch = "x86_64"
url = "https://typst.app"

build_deps = ['pkgconf', 'rust-bin']
link_deps = ['gcc:gcc-libs', 'glibc', 'openssl']

[[sources]]
type = "http"
sha256 = "c07909e01a2a6941e52c9b616e48c209c755eed416d62bcf5583c37a4aca01a3"
url = "https://github.com/typst/typst/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
isolation = "relaxed"
env = { CARGO_HOME = '${WORKDIR}/.cargo', GEN_ARTIFACTS = 'artifacts', OPENSSL_NO_VENDOR = '1', TYPST_VERSION = '${VERSION}' }
script = '''
cd source/typst-${VERSION}
cargo build --release --locked -p typst-cli'''

[pipeline.staging]
script = '''
cd source/typst-${VERSION}

install -Dm755 target/release/typst ${STAGING_DIR}/usr/bin/typst

# Shell completions
install -Dm644 crates/typst-cli/artifacts/typst.bash ${STAGING_DIR}/usr/share/bash-completion/completions/typst
install -Dm644 crates/typst-cli/artifacts/typst.fish ${STAGING_DIR}/usr/share/fish/vendor_completions.d/typst.fish
install -Dm644 crates/typst-cli/artifacts/_typst ${STAGING_DIR}/usr/share/zsh/site-functions/_typst

# Man pages
for man in crates/typst-cli/artifacts/*.1; do
  install -Dm644 "${man}" "${STAGING_DIR}/usr/share/man/man1/$(basename "${man}")"
done'''

[[output]]
name = "typst"
runtime_deps = ['gcc:gcc-libs', 'glibc', 'openssl']
