name = "expat"
version = "2.8.5"
release = 1
description = "Stream oriented C library for parsing XML"
license = "MIT"
arch = "x86_64"
url = "https://libexpat.github.io/"


[[sources]]
type = "http"
sha256 = "1e727b8933ec51a77a9a9d9afcf8e688bce45d907c13e36ab7393fe36e703182"
url = "https://github.com/libexpat/libexpat/releases/download/R_2_8_5/expat-${VERSION}.tar.xz"
extract_to = "source"

[pipeline.configure]
script = '''
cd source/expat-${VERSION}
CONFIG_SHELL=/usr/bin/bash /usr/bin/bash ./configure --prefix=/usr \
--disable-static \
--docdir=/usr/share/doc/expat-${VERSION}'''

[pipeline.compile]
script = '''
cd source/expat-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/expat-${VERSION}
make DESTDIR=${STAGING_DIR} install
install -v -m644 doc/*.{html,css} ${STAGING_DIR}/usr/share/doc/expat-${VERSION}'''
