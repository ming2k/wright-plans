name = "swig"
version = "4.5.1"
release = 1
description = "Simplified Wrapper and Interface Generator"
license = "GPL-3.0-or-later"
arch = "x86_64"
url = "https://swig.org"

link_deps = ['pcre2', 'zlib']

[[sources]]
type = "http"
sha256 = "dd219a0c8947afe63b818892304390427c2ee7f6edfa1a37853d4efd891982be"
url = "https://github.com/swig/swig/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.prepare]
script = '''
cd source/swig-${VERSION}
./autogen.sh'''

[pipeline.configure]
script = '''
cd source/swig-${VERSION}
./configure --prefix=/usr \
            --with-pcre2'''

[pipeline.compile]
script = '''
cd source/swig-${VERSION}
make -j$(nproc)'''

[pipeline.staging]
script = '''
cd source/swig-${VERSION}
make DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['pcre2', 'zlib']
