name = "ocl-icd"
version = "2026.05.29"
release = 1
description = "OpenCL ICD Loader (official Khronos implementation)"
license = "Apache-2.0"
arch = "x86_64"
url = "https://github.com/KhronosGroup/OpenCL-ICD-Loader"

link_deps = ['glibc']
build_deps = ['ninja', 'cmake', 'opencl-headers']

[[sources]]
type = "http"
url = "https://github.com/KhronosGroup/OpenCL-ICD-Loader/archive/refs/tags/v${VERSION}.tar.gz"
sha256 = "48fd0c5181db7cd046f4f731d5955694892e10998d49d09ee0d997e7e04fd939"
extract_to = "source"

[pipeline.configure]
script = '''
cmake -B build -S "${WORKDIR}/source/OpenCL-ICD-Loader-${VERSION}" \
    -GNinja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_BUILD_TYPE=Release \
    -DOPENCL_ICD_LOADER_HEADERS_DIR=/usr/include
'''

[pipeline.compile]
script = "cmake --build build -j$(nproc)"

[pipeline.staging]
script = '''
DESTDIR=${STAGING_DIR} cmake --install build
install -D -m644 "${WORKDIR}/source/OpenCL-ICD-Loader-${VERSION}/LICENSE" \
    -t "${STAGING_DIR}/usr/share/licenses/${NAME}"
'''

[[output]]
runtime_deps = ['glibc']

