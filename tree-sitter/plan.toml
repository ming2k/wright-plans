name = "tree-sitter"
version = "0.27.0"
release = 1
description = "An incremental parsing system for programming tools"
license = "MIT"
arch = "x86_64"
url = "https://tree-sitter.github.io/tree-sitter/"

link_deps = ['glibc']

[[sources]]
type = "http"
sha256 = "d35c96e68736bd9569d2757c3cc71052485f33082c3825f1aed9d0e86013a159"
url = "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v${VERSION}.tar.gz"
extract_to = "source"

[pipeline.compile]
script = '''
cd source/tree-sitter-${VERSION}
make -j$(nproc) PREFIX=/usr'''

[pipeline.staging]
script = '''
cd source/tree-sitter-${VERSION}
make PREFIX=/usr DESTDIR=${STAGING_DIR} install'''

[[output]]
runtime_deps = ['glibc']
